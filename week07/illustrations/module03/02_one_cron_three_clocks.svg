<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720"><defs><marker id="arr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#5a6270"/></marker><marker id="arrg" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#2e8b57"/></marker><marker id="arrr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#c0392b"/></marker><marker id="arrb" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#3b6ea5"/></marker><marker id="arrk" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#1f2430"/></marker><marker id="arrp" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#6f4fa3"/></marker><marker id="arra" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#c07d1a"/></marker></defs><rect x="0" y="0" width="1280" height="720" fill="#ffffff"/><text x="64" y="58" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="bold" fill="#1f2430">One Cron String, Three Clocks</text><text x="64" y="88" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#5a6270">schedule="0 2 * * 1" on Airflow 3 is a point in time. The seven-day window you expect must be declared.</text><line x1="400" y1="640" x2="1200" y2="640" stroke="#9aa1ab" stroke-width="2"/><line x1="400.0" y1="130" x2="400.0" y2="646" stroke="#9aa1ab" stroke-width="1.5" stroke-dasharray="4 4"/><text x="400.0" y="666" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1f2430" text-anchor="middle">Mon Sep 7  02:00</text><line x1="800.0" y1="130" x2="800.0" y2="646" stroke="#9aa1ab" stroke-width="1.5" stroke-dasharray="4 4"/><text x="800.0" y="666" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1f2430" text-anchor="middle">Mon Sep 14  02:00</text><line x1="1200.0" y1="130" x2="1200.0" y2="646" stroke="#9aa1ab" stroke-width="1.5" stroke-dasharray="4 4"/><text x="1200.0" y="666" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1f2430" text-anchor="middle">Mon Sep 21  02:00</text><text x="600.0" y="666" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5a6270" text-anchor="middle">all at 02:00, not midnight</text><text x="64" y="152" font-family="Menlo, Consolas, monospace" font-size="13.5" font-weight="bold" fill="#1f2430" text-anchor="start">"0 2 * * 1"</text><text x="64" y="172" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#5a6270" text-anchor="start">CronTriggerTimetable, Airflow 3 default</text><text x="64" y="190" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#2e8b57" text-anchor="start">zero-width interval at the trigger</text><circle cx="800.0" cy="188" r="9" fill="#e8f5ec" stroke="#2e8b57" stroke-width="3"/><text x="816.0" y="176" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#2e8b57" text-anchor="start">data_interval_start = data_interval_end</text><text x="816.0" y="194" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#2e8b57" text-anchor="start">= logical_date = Sep 14 02:00</text><text x="816.0" y="212" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5a6270" text-anchor="start">DAG run fires here</text><text x="64" y="312" font-family="Menlo, Consolas, monospace" font-size="13.5" font-weight="bold" fill="#1f2430" text-anchor="start">CronTriggerTimetable(..., interval=7d)</text><text x="64" y="332" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#5a6270" text-anchor="start">fires at the cron; window reaches back</text><text x="64" y="350" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#3b6ea5" text-anchor="start">seven days ending at the trigger</text><rect x="400.0" y="330" width="400.0" height="36" rx="6" fill="#eaf1fb" stroke="#3b6ea5" stroke-width="2"/><text x="600.0" y="353" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#3b6ea5" text-anchor="middle">data interval: Sep 7 02:00 to Sep 14 02:00</text><text x="404.0" y="384" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#3b6ea5" text-anchor="start">logical_date = Sep 7 02:00</text><line x1="800.0" y1="380" x2="800.0" y2="368" stroke="#3b6ea5" stroke-width="2.5" marker-end="url(#arrb)"/><text x="808.0" y="386" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5a6270" text-anchor="start">run fires Sep 14 02:00</text><text x="64" y="472" font-family="Menlo, Consolas, monospace" font-size="13.5" font-weight="bold" fill="#1f2430" text-anchor="start">CronDataIntervalTimetable(...)</text><text x="64" y="492" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#5a6270" text-anchor="start">Airflow 2 behaviour; fires when it closes</text><text x="64" y="510" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#6f4fa3" text-anchor="start">window between ticks, run at the end</text><rect x="400.0" y="490" width="400.0" height="36" rx="6" fill="#f1ecfa" stroke="#6f4fa3" stroke-width="2"/><text x="600.0" y="513" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#6f4fa3" text-anchor="middle">data interval: Sep 7 02:00 to Sep 14 02:00</text><text x="404.0" y="544" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#6f4fa3" text-anchor="start">logical_date = Sep 7 02:00</text><line x1="800.0" y1="540" x2="800.0" y2="528" stroke="#6f4fa3" stroke-width="2.5" marker-end="url(#arrp)"/><text x="808.0" y="546" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5a6270" text-anchor="start">run fires Sep 14 02:00</text><rect x="64" y="556" width="300" height="70" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="2"/><text x="84" y="578" font-family="Menlo, Consolas, monospace" font-size="12.5" font-weight="bold" fill="#c0392b" text-anchor="start">{{ execution_date }}: undefined</text><text x="84" y="598" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#1f2430" text-anchor="start">on 3.x; the task fails. Manual and</text><text x="84" y="616" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#1f2430" text-anchor="start">test runs: zero-width. Assets: None.</text><rect x="400" y="556" width="800" height="58" rx="8" fill="#e8f5ec" stroke="#2e8b57" stroke-width="2"/><text x="420" y="580" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#2e8b57" text-anchor="start">Need a window? Declare it with a timetable. Read data_interval_start and end; never do date math</text><text x="420" y="600" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1f2430" text-anchor="start">on logical_date. Same cron string, same 02:00 instants, three different meanings.</text><text x="64" y="700" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#5a6270" text-anchor="start">Verified 3.3.1 (create_cron_data_intervals = False): row 1 first run logical_date Sep 7 02:00, start == end; row 2 first run logical_date Aug 31 02:00; row 3 first run fires Sep 14.</text></svg>