<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720"><defs><marker id="arr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#5a6270"/></marker><marker id="arrg" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#2e8b57"/></marker><marker id="arrr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#c0392b"/></marker><marker id="arrb" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#3b6ea5"/></marker><marker id="arrk" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#1f2430"/></marker><marker id="arrp" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#6f4fa3"/></marker><marker id="arra" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#c07d1a"/></marker></defs><rect x="0" y="0" width="1280" height="720" fill="#ffffff"/><text x="64" y="58" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="bold" fill="#1f2430">Retries and Backoff, to the Second</text><text x="64" y="88" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#5a6270">retries=3, retry_delay=5 min, multiplier 2.0, max_retry_delay=1 h. Where each wait comes from.</text><line x1="100" y1="330" x2="1020" y2="330" stroke="#9aa1ab" stroke-width="2"/><line x1="100.0" y1="325" x2="100.0" y2="335" stroke="#9aa1ab" stroke-width="2"/><text x="100.0" y="354" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5a6270" text-anchor="middle">0 min</text><line x1="215.0" y1="325" x2="215.0" y2="335" stroke="#9aa1ab" stroke-width="2"/><text x="215.0" y="354" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5a6270" text-anchor="middle">10 min</text><line x1="330.0" y1="325" x2="330.0" y2="335" stroke="#9aa1ab" stroke-width="2"/><text x="330.0" y="354" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5a6270" text-anchor="middle">20 min</text><line x1="445.0" y1="325" x2="445.0" y2="335" stroke="#9aa1ab" stroke-width="2"/><text x="445.0" y="354" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5a6270" text-anchor="middle">30 min</text><line x1="560.0" y1="325" x2="560.0" y2="335" stroke="#9aa1ab" stroke-width="2"/><text x="560.0" y="354" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5a6270" text-anchor="middle">40 min</text><line x1="675.0" y1="325" x2="675.0" y2="335" stroke="#9aa1ab" stroke-width="2"/><text x="675.0" y="354" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5a6270" text-anchor="middle">50 min</text><line x1="790.0" y1="325" x2="790.0" y2="335" stroke="#9aa1ab" stroke-width="2"/><text x="790.0" y="354" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5a6270" text-anchor="middle">60 min</text><line x1="905.0" y1="325" x2="905.0" y2="335" stroke="#9aa1ab" stroke-width="2"/><text x="905.0" y="354" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5a6270" text-anchor="middle">70 min</text><line x1="1020.0" y1="325" x2="1020.0" y2="335" stroke="#9aa1ab" stroke-width="2"/><text x="1020.0" y="354" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5a6270" text-anchor="middle">80 min</text><text x="100" y="140" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2430" text-anchor="start">Worst case timeline (every jitter lands at its maximum)</text><rect x="70.0" y="180" width="60" height="44" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="2"/><text x="100.0" y="199" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#1f2430" text-anchor="middle">try 1</text><text x="100.0" y="216" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">fails</text><line x1="100.0" y1="224" x2="100.0" y2="330" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3 3"/><rect x="185.0" y="180" width="60" height="44" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="2"/><text x="215.0" y="199" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#1f2430" text-anchor="middle">try 2</text><text x="215.0" y="216" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">fails</text><line x1="215.0" y1="224" x2="215.0" y2="330" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3 3"/><rect x="415.0" y="180" width="60" height="44" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="2"/><text x="445.0" y="199" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#1f2430" text-anchor="middle">try 3</text><text x="445.0" y="216" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">fails</text><line x1="445.0" y1="224" x2="445.0" y2="330" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3 3"/><rect x="875.0" y="180" width="60" height="44" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="2"/><text x="905.0" y="199" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#1f2430" text-anchor="middle">try 4</text><text x="905.0" y="216" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">fails</text><line x1="905.0" y1="224" x2="905.0" y2="330" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3 3"/><rect x="132.0" y="250" width="51.0" height="34" rx="17" fill="#fdf3e0" stroke="#c07d1a" stroke-width="2"/><text x="157.5" y="306" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#c07d1a" text-anchor="middle">wait 5 to 10 min</text><rect x="247.0" y="250" width="166.0" height="34" rx="17" fill="#fdf3e0" stroke="#c07d1a" stroke-width="2"/><text x="330.0" y="272" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#c07d1a" text-anchor="middle">wait 10 to 20 min</text><rect x="477.0" y="250" width="396.0" height="34" rx="17" fill="#fdf3e0" stroke="#c07d1a" stroke-width="2"/><text x="675.0" y="272" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#c07d1a" text-anchor="middle">wait 20 to 40 min</text><rect x="1040" y="172" width="200" height="60" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="2"/><text x="1140" y="196" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#c0392b" text-anchor="middle">retries exhausted:</text><text x="1140" y="216" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2430" text-anchor="middle">task failed, callback fires</text><line x1="937.0" y1="202" x2="1036" y2="202" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrr)"/><rect x="64" y="376" width="560" height="300" rx="12" fill="#fbfbfd" stroke="#1f2430" stroke-width="2"/><text x="84" y="404" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2430" text-anchor="start">The formula (TaskInstance.next_retry_datetime, 3.3.1 source)</text><text x="84" y="432" font-family="Menlo, Consolas, monospace" font-size="13" font-weight="normal" fill="#1f2430" text-anchor="start">min_backoff = ceil(300 * 2.0 ** (try_number - 1))</text><text x="84" y="456" font-family="Menlo, Consolas, monospace" font-size="13" font-weight="normal" fill="#1f2430" text-anchor="start">jitter      = sha1(dag#task#logical_date#try) % min_backoff</text><text x="84" y="480" font-family="Menlo, Consolas, monospace" font-size="13" font-weight="normal" fill="#1f2430" text-anchor="start">delay       = min(min_backoff + jitter, 86400, max_retry_delay)</text><text x="84" y="512" font-family="Menlo, Consolas, monospace" font-size="12.5" font-weight="normal" fill="#1f2430" text-anchor="start">after try 1:  300 * 1 = 300 s   wait in [300, 600)  =  5 to 10 min</text><text x="84" y="534" font-family="Menlo, Consolas, monospace" font-size="12.5" font-weight="normal" fill="#1f2430" text-anchor="start">after try 2:  300 * 2 = 600 s   wait in [600, 1200) = 10 to 20 min</text><text x="84" y="556" font-family="Menlo, Consolas, monospace" font-size="12.5" font-weight="normal" fill="#1f2430" text-anchor="start">after try 3:  300 * 4 = 1200 s  wait in [1200, 2400) = 20 to 40 min</text><text x="84" y="586" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#c07d1a" text-anchor="start">total before the last attempt: 35 min best case, 70 min worst case</text><text x="84" y="610" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5a6270" text-anchor="start">the 1 h cap never binds here; it would clip a hypothetical try 5 (2400 to 4800 s).</text><text x="84" y="636" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5a6270" text-anchor="start">retry_exponential_backoff=True is deserialized as multiplier 2.0 on 3.3;</text><text x="84" y="656" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5a6270" text-anchor="start">writing 2.0 is clearer. Jitter is deterministic per task instance.</text><rect x="656" y="376" width="560" height="300" rx="12" fill="#fbfbfd" stroke="#1f2430" stroke-width="2"/><text x="676" y="404" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2430" text-anchor="start">Retry only what time can fix</text><rect x="676" y="420" width="250" height="120" rx="8" fill="#e8f5ec" stroke="#2e8b57" stroke-width="2"/><text x="692" y="444" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#2e8b57" text-anchor="start">Retry</text><text x="692" y="468" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1f2430" text-anchor="start">DVC remote timeout</text><text x="692" y="490" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1f2430" text-anchor="start">LLM server rate limit</text><text x="692" y="512" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1f2430" text-anchor="start">transient disk or network</text><rect x="946" y="420" width="250" height="120" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="2"/><text x="962" y="444" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="start">Do not retry</text><text x="962" y="468" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1f2430" text-anchor="start">schema validation error</text><text x="962" y="490" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1f2430" text-anchor="start">out of memory on the Mac</text><text x="962" y="512" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1f2430" text-anchor="start">bad credential</text><text x="676" y="570" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="start">A retry of a deterministic failure is 70 minutes of silence before the alert.</text><text x="676" y="596" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#5a6270" text-anchor="start">Set retries=0 on tasks whose failures are never transient, or raise</text><text x="676" y="616" font-family="Menlo, Consolas, monospace" font-size="12.5" font-weight="normal" fill="#5a6270" text-anchor="start">AirflowFailException to fail immediately without consuming retries.</text><text x="676" y="648" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#1f2430" text-anchor="start">on_failure_callback fires once, after the final attempt, not per retry.</text></svg>