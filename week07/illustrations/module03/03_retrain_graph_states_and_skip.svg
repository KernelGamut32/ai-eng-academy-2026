<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720"><defs><marker id="arr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#5a6270"/></marker><marker id="arrg" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#2e8b57"/></marker><marker id="arrr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#c0392b"/></marker><marker id="arrb" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#3b6ea5"/></marker><marker id="arrk" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#1f2430"/></marker><marker id="arrp" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#6f4fa3"/></marker><marker id="arra" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#c07d1a"/></marker></defs><rect x="0" y="0" width="1280" height="720" fill="#ffffff"/><text x="64" y="58" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="bold" fill="#1f2430">The Retrain Graph After Monday's Run</text><text x="64" y="88" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#5a6270">Read task states like a CI job list. The gate failed this week. Skipped is not failed, and it spreads.</text><rect x="64" y="250" width="130" height="54" rx="8" fill="#e8f5ec" stroke="#2e8b57" stroke-width="2"/><text x="129.0" y="272" font-family="Menlo, Consolas, monospace" font-size="13" font-weight="bold" fill="#1f2430" text-anchor="middle">pull_reviews</text><text x="129.0" y="292" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#2e8b57" text-anchor="middle">success</text><line x1="194" y1="277" x2="226" y2="277" stroke="#2e8b57" stroke-width="2.5" marker-end="url(#arrg)"/><rect x="230" y="250" width="120" height="54" rx="8" fill="#e8f5ec" stroke="#2e8b57" stroke-width="2"/><text x="290.0" y="272" font-family="Menlo, Consolas, monospace" font-size="13" font-weight="bold" fill="#1f2430" text-anchor="middle">preprocess</text><text x="290.0" y="292" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#2e8b57" text-anchor="middle">success</text><line x1="350" y1="277" x2="382" y2="277" stroke="#2e8b57" stroke-width="2.5" marker-end="url(#arrg)"/><rect x="386" y="250" width="100" height="54" rx="8" fill="#e8f5ec" stroke="#2e8b57" stroke-width="2"/><text x="436.0" y="272" font-family="Menlo, Consolas, monospace" font-size="13" font-weight="bold" fill="#1f2430" text-anchor="middle">train</text><text x="436.0" y="292" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#2e8b57" text-anchor="middle">success</text><path d="M 486 277 C 520 277, 520 177, 546 177" stroke="#2e8b57" stroke-width="2.5" fill="none" marker-end="url(#arrg)"/><rect x="550" y="150" width="130" height="54" rx="8" fill="#e8f5ec" stroke="#2e8b57" stroke-width="2"/><text x="615.0" y="172" font-family="Menlo, Consolas, monospace" font-size="13" font-weight="bold" fill="#1f2430" text-anchor="middle">eval_rouge</text><text x="615.0" y="192" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#2e8b57" text-anchor="middle">success</text><path d="M 680 177 C 710 177, 710 277, 736 277" stroke="#2e8b57" stroke-width="2.5" fill="none" marker-end="url(#arrg)"/><path d="M 486 277 C 520 277, 520 277, 546 277" stroke="#2e8b57" stroke-width="2.5" fill="none" marker-end="url(#arrg)"/><rect x="550" y="250" width="130" height="54" rx="8" fill="#e8f5ec" stroke="#2e8b57" stroke-width="2"/><text x="615.0" y="272" font-family="Menlo, Consolas, monospace" font-size="13" font-weight="bold" fill="#1f2430" text-anchor="middle">eval_toxicity</text><text x="615.0" y="292" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#2e8b57" text-anchor="middle">success</text><path d="M 680 277 C 710 277, 710 277, 736 277" stroke="#2e8b57" stroke-width="2.5" fill="none" marker-end="url(#arrg)"/><path d="M 486 277 C 520 277, 520 377, 546 377" stroke="#2e8b57" stroke-width="2.5" fill="none" marker-end="url(#arrg)"/><rect x="550" y="350" width="130" height="54" rx="8" fill="#e8f5ec" stroke="#2e8b57" stroke-width="2"/><text x="615.0" y="372" font-family="Menlo, Consolas, monospace" font-size="13" font-weight="bold" fill="#1f2430" text-anchor="middle">eval_latency</text><text x="615.0" y="392" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#2e8b57" text-anchor="middle">success</text><path d="M 680 377 C 710 377, 710 277, 736 277" stroke="#2e8b57" stroke-width="2.5" fill="none" marker-end="url(#arrg)"/><rect x="740" y="250" width="140" height="54" rx="8" fill="#e8f5ec" stroke="#2e8b57" stroke-width="2"/><text x="810.0" y="272" font-family="Menlo, Consolas, monospace" font-size="13" font-weight="bold" fill="#1f2430" text-anchor="middle">quality_gate</text><text x="810.0" y="292" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#2e8b57" text-anchor="middle">success</text><text x="810" y="322" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#5a6270" text-anchor="middle">@task.branch returned</text><text x="810" y="338" font-family="Menlo, Consolas, monospace" font-size="11.5" font-weight="bold" fill="#c0392b" text-anchor="middle">"alert_quality_regression"</text><path d="M 880 270 C 910 270, 910 177, 936 177" stroke="#c07d1a" stroke-width="2.5" fill="none" stroke-dasharray="6 4" marker-end="url(#arra)"/><rect x="940" y="150" width="150" height="54" rx="8" fill="#fdf3e0" stroke="#c07d1a" stroke-width="2"/><text x="1015.0" y="172" font-family="Menlo, Consolas, monospace" font-size="13" font-weight="bold" fill="#1f2430" text-anchor="middle">register_model</text><text x="1015.0" y="192" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#c07d1a" text-anchor="middle">skipped</text><path d="M 880 284 C 910 284, 910 377, 936 377" stroke="#2e8b57" stroke-width="2.5" fill="none" marker-end="url(#arrg)"/><rect x="940" y="350" width="150" height="54" rx="8" fill="#e8f5ec" stroke="#2e8b57" stroke-width="2"/><text x="1015.0" y="372" font-family="Menlo, Consolas, monospace" font-size="13" font-weight="bold" fill="#1f2430" text-anchor="middle">alert_quality_reg</text><text x="1015.0" y="392" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#2e8b57" text-anchor="middle">success</text><text x="1015" y="420" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#2e8b57" text-anchor="middle">callback posted the alert</text><path d="M 1090 177 C 1120 177, 1120 277, 1146 277" stroke="#c07d1a" stroke-width="2.5" fill="none" stroke-dasharray="6 4" marker-end="url(#arra)"/><rect x="1150" y="250" width="120" height="54" rx="8" fill="#fdf3e0" stroke="#c07d1a" stroke-width="2"/><text x="1210.0" y="272" font-family="Menlo, Consolas, monospace" font-size="13" font-weight="bold" fill="#1f2430" text-anchor="middle">promote</text><text x="1210.0" y="292" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#c07d1a" text-anchor="middle">skipped</text><text x="1210" y="322" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#5a6270" text-anchor="middle">depends only on</text><text x="1210" y="338" font-family="Menlo, Consolas, monospace" font-size="11" font-weight="normal" fill="#5a6270" text-anchor="middle">register_model</text><rect x="64" y="120" width="420" height="28" rx="6" fill="#ffffff" stroke="#9aa1ab" stroke-width="2"/><text x="76" y="139" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#1f2430" text-anchor="start">DagRun state: success.  ROUGE-L 0.33 &lt; 0.38, so the gate took the alert branch.</text><rect x="64" y="450" width="1152" height="232" rx="12" fill="#fbfbfd" stroke="#1f2430" stroke-width="2"/><text x="84" y="478" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1f2430" text-anchor="start">Why skipped spreads: the default trigger rule is all_success</text><text x="84" y="500" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#5a6270" text-anchor="start">Executed on 3.3.1 with a chain fmt &gt;&gt; skipper &gt;&gt; after_skip, where skipper raised AirflowSkipException:</text><rect x="84" y="518" width="150" height="44" rx="22" fill="#e8f5ec" stroke="#2e8b57" stroke-width="2"/><text x="159" y="538" font-family="Menlo, Consolas, monospace" font-size="12.5" font-weight="bold" fill="#1f2430" text-anchor="middle">fmt</text><text x="159" y="554" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#2e8b57" text-anchor="middle">success</text><line x1="234" y1="540" x2="264" y2="540" stroke="#2e8b57" stroke-width="2.5" marker-end="url(#arrg)"/><rect x="268" y="518" width="150" height="44" rx="22" fill="#fdf3e0" stroke="#c07d1a" stroke-width="2"/><text x="343" y="538" font-family="Menlo, Consolas, monospace" font-size="12.5" font-weight="bold" fill="#1f2430" text-anchor="middle">skipper</text><text x="343" y="554" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#c07d1a" text-anchor="middle">skipped</text><line x1="418" y1="540" x2="448" y2="540" stroke="#c07d1a" stroke-width="2.5" marker-end="url(#arra)"/><rect x="452" y="518" width="150" height="44" rx="22" fill="#fdf3e0" stroke="#c07d1a" stroke-width="2"/><text x="527" y="538" font-family="Menlo, Consolas, monospace" font-size="12.5" font-weight="bold" fill="#1f2430" text-anchor="middle">after_skip</text><text x="527" y="554" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#c07d1a" text-anchor="middle">skipped</text><text x="612" y="545" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#c07d1a" text-anchor="start">never ran; it had nothing to do with the skip</text><text x="84" y="594" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1f2430" text-anchor="start">Fix A:</text><text x="132" y="594" font-family="Menlo, Consolas, monospace" font-size="13" font-weight="normal" fill="#1f2430" text-anchor="start">@task(trigger_rule="none_failed")</text><text x="400" y="594" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#5a6270" text-anchor="start">on the downstream task: runs when no upstream failed; skipped upstreams allowed.</text><text x="84" y="620" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1f2430" text-anchor="start">Fix B:</text><text x="132" y="620" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#5a6270" text-anchor="start">do not skip; return the existing mlflow_run_id so evaluate still runs against the cached model.</text><text x="84" y="646" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#5a6270" text-anchor="start">Join tasks below a branch need</text><text x="282" y="646" font-family="Menlo, Consolas, monospace" font-size="12.5" font-weight="normal" fill="#1f2430" text-anchor="start">trigger_rule="none_failed_min_one_success"</text><text x="610" y="646" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#5a6270" text-anchor="start">or they skip whenever either branch skips.</text><text x="84" y="672" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="start">A DagRun with skipped tasks is still success. Green does not mean the model moved. Look at the alias, not the colour.</text></svg>