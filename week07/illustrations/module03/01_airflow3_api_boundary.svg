<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720"><defs><marker id="arr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#5a6270"/></marker><marker id="arrg" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#2e8b57"/></marker><marker id="arrr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#c0392b"/></marker><marker id="arrb" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#3b6ea5"/></marker><marker id="arrk" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#1f2430"/></marker><marker id="arrp" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#6f4fa3"/></marker><marker id="arra" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#c07d1a"/></marker></defs><rect x="0" y="0" width="1280" height="720" fill="#ffffff"/><text x="64" y="58" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="bold" fill="#1f2430">Airflow 3: The API Boundary</text><text x="64" y="88" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#5a6270">Workers never touch the metadata database. Every Airflow 2 breakage in this module traces to this line.</text><rect x="64" y="116" width="700" height="420" rx="14" fill="#fbfbfd" stroke="#1f2430" stroke-width="2.5"/><text x="84" y="146" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1f2430" text-anchor="start">Control plane (trusted, holds DB credentials)</text><rect x="96" y="170" width="200" height="90" rx="10" fill="#eaf1fb" stroke="#3b6ea5" stroke-width="2"/><text x="196" y="200" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1f2430" text-anchor="middle">DAG processor</text><text x="196" y="222" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#5a6270" text-anchor="middle">parses dags/, serializes</text><text x="196" y="240" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#c07d1a" text-anchor="middle">parse errors live here</text><rect x="320" y="170" width="200" height="90" rx="10" fill="#eaf1fb" stroke="#3b6ea5" stroke-width="2"/><text x="420" y="200" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1f2430" text-anchor="middle">Scheduler</text><text x="420" y="222" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#5a6270" text-anchor="middle">due runs, ready tasks</text><text x="420" y="240" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5a6270" text-anchor="middle">cron or asset event</text><rect x="544" y="170" width="196" height="90" rx="10" fill="#eaf1fb" stroke="#3b6ea5" stroke-width="2"/><text x="642" y="200" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1f2430" text-anchor="middle">Triggerer</text><text x="642" y="222" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#5a6270" text-anchor="middle">async waits for</text><text x="642" y="240" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#5a6270" text-anchor="middle">deferrable sensors</text><rect x="96" y="292" width="644" height="80" rx="10" fill="#f2f3f5" stroke="#9aa1ab" stroke-width="2"/><text x="418" y="322" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1f2430" text-anchor="middle">Metadata DB (PostgreSQL in production, SQLite in class)</text><text x="418" y="348" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#5a6270" text-anchor="middle">DAG versions, DagRuns, task states, XCom, Variables, Connections</text><rect x="96" y="404" width="644" height="100" rx="10" fill="#f1ecfa" stroke="#6f4fa3" stroke-width="2.5"/><text x="418" y="436" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1f2430" text-anchor="middle">API server (FastAPI)</text><text x="418" y="460" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#5a6270" text-anchor="middle">serves the React UI to humans  and  the Task Execution API to workers</text><text x="418" y="484" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#6f4fa3" text-anchor="middle">replaces the Airflow 2 Flask webserver</text><line x1="196" y1="260" x2="196" y2="288" stroke="#3b6ea5" stroke-width="2.5" marker-end="url(#arrb)"/><line x1="420" y1="288" x2="420" y2="262" stroke="#3b6ea5" stroke-width="2.5" marker-end="url(#arrb)"/><line x1="418" y1="372" x2="418" y2="400" stroke="#6f4fa3" stroke-width="2.5" marker-end="url(#arrp)"/><line x1="800" y1="116" x2="800" y2="536" stroke="#c0392b" stroke-width="3" stroke-dasharray="10 6"/><text x="800" y="560" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">THE BOUNDARY</text><rect x="836" y="116" width="380" height="420" rx="14" fill="#fbfbfd" stroke="#1f2430" stroke-width="2.5"/><text x="856" y="146" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1f2430" text-anchor="start">Execution side (untrusted, no DB creds)</text><rect x="868" y="170" width="316" height="90" rx="10" fill="#e8f5ec" stroke="#2e8b57" stroke-width="2"/><text x="1026" y="200" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1f2430" text-anchor="middle">Executor</text><text x="1026" y="222" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#5a6270" text-anchor="middle">LocalExecutor (class), Celery,</text><text x="1026" y="240" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#5a6270" text-anchor="middle">Kubernetes, Edge</text><rect x="868" y="292" width="316" height="212" rx="10" fill="#e8f5ec" stroke="#2e8b57" stroke-width="2.5"/><text x="1026" y="322" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1f2430" text-anchor="middle">Worker process</text><rect x="888" y="336" width="276" height="150" rx="8" fill="#ffffff" stroke="#2e8b57" stroke-width="2"/><text x="904" y="360" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#1f2430" text-anchor="start">Task SDK (airflow.sdk)</text><text x="904" y="382" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#5a6270" text-anchor="start">1 fetch task definition + context</text><text x="904" y="400" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#5a6270" text-anchor="start">2 run your @task body</text><text x="904" y="418" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#5a6270" text-anchor="start">3 push state + XCom back</text><text x="904" y="446" font-family="Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#5a6270" text-anchor="start">Variable.get, xcom_pull(task_ids, key),</text><text x="904" y="464" font-family="Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#5a6270" text-anchor="start">get_connection: all via the API</text><line x1="1026" y1="260" x2="1026" y2="288" stroke="#2e8b57" stroke-width="2.5" marker-end="url(#arrg)"/><path d="M 740 215 C 790 215, 800 215, 864 215" stroke="#1f2430" stroke-width="2.5" fill="none" marker-end="url(#arrk)"/><text x="802" y="206" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#1f2430" text-anchor="middle">dispatch</text><path d="M 884 410 C 820 410, 800 454, 744 454" stroke="#6f4fa3" stroke-width="3" fill="none" marker-end="url(#arrp)"/><path d="M 744 470 C 800 470, 820 430, 884 430" stroke="#6f4fa3" stroke-width="3" fill="none" marker-end="url(#arrp)"/><text x="802" y="496" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#6f4fa3" text-anchor="middle">HTTP only</text><rect x="64" y="584" width="1152" height="108" rx="10" fill="#fdf3e0" stroke="#c07d1a" stroke-width="2"/><text x="84" y="610" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#c07d1a" text-anchor="start">What this boundary broke (all executed on 3.3.1):</text><text x="84" y="634" font-family="Menlo, Consolas, monospace" font-size="13" font-weight="normal" fill="#1f2430" text-anchor="start">TaskInstance(execution_date=...) + task.execute() in tests: TypeError.   ti.xcom_pull() with no args: None.</text><text x="84" y="656" font-family="Menlo, Consolas, monospace" font-size="13" font-weight="normal" fill="#1f2430" text-anchor="start">airflow webserver: not a command (api-server).   Parse errors: DAG processor log, not scheduler log.</text><text x="84" y="680" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1f2430" text-anchor="start">What it enabled: tasks in any Python, any container, and since 3.3 any language, with zero DB access.</text></svg>