<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720"><defs><marker id="arr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#5a6270"/></marker><marker id="arrg" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#2e8b57"/></marker><marker id="arrr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#c0392b"/></marker><marker id="arrb" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#3b6ea5"/></marker><marker id="arrk" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#1f2430"/></marker><marker id="arrp" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#6f4fa3"/></marker><marker id="arra" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#c07d1a"/></marker></defs><rect x="0" y="0" width="1280" height="720" fill="#ffffff"/><text x="64" y="58" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="bold" fill="#1f2430">Aliases Are Pointers: Three Mondays in the Registry</text><text x="64" y="88" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#5a6270">The serving process loads models:/cordwell_review_summarizer@champion. Promotion and rollback move one pointer.</text><rect x="64" y="116" width="384" height="400" rx="12" fill="#fbfbfd" stroke="#1f2430" stroke-width="2"/><text x="84" y="146" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1f2430" text-anchor="start">Mon Sep 7</text><text x="84" y="168" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#5a6270" text-anchor="start">v8 registered, gate passed</text><rect x="448" y="116" width="384" height="400" rx="12" fill="#fbfbfd" stroke="#1f2430" stroke-width="2"/><text x="468" y="146" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1f2430" text-anchor="start">Mon Sep 14</text><text x="468" y="168" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#5a6270" text-anchor="start">v8 promoted; v9 trained</text><rect x="832" y="116" width="384" height="400" rx="12" fill="#fbfbfd" stroke="#1f2430" stroke-width="2"/><text x="852" y="146" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1f2430" text-anchor="start">Mon Sep 21</text><text x="852" y="168" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#5a6270" text-anchor="start">v9 regressed, rollback</text><rect x="234" y="200" width="190" height="44" rx="8" fill="#e8f5ec" stroke="#2e8b57" stroke-width="2"/><text x="248" y="228" font-family="Menlo, Consolas, monospace" font-size="13.5" font-weight="bold" fill="#1f2430" text-anchor="start">version 7</text><text x="410" y="228" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#2e8b57" text-anchor="end">serving</text><rect x="234" y="280" width="190" height="44" rx="8" fill="#eaf1fb" stroke="#3b6ea5" stroke-width="2"/><text x="248" y="308" font-family="Menlo, Consolas, monospace" font-size="13.5" font-weight="bold" fill="#1f2430" text-anchor="start">version 8</text><text x="410" y="308" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#3b6ea5" text-anchor="end">candidate</text><rect x="234" y="360" width="190" height="44" rx="8" fill="#f2f3f5" stroke="#9aa1ab" stroke-width="2"/><text x="248" y="388" font-family="Menlo, Consolas, monospace" font-size="13.5" font-weight="bold" fill="#1f2430" text-anchor="start">version 9</text><text x="410" y="388" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#9aa1ab" text-anchor="end">idle</text><text x="329" y="424" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#5a6270" text-anchor="middle">(not yet trained)</text><rect x="88" y="205" width="130" height="34" rx="17" fill="#ffffff" stroke="#2e8b57" stroke-width="2.5"/><text x="153" y="227" font-family="Menlo, Consolas, monospace" font-size="12.5" font-weight="bold" fill="#2e8b57" text-anchor="middle">@champion</text><line x1="218" y1="222" x2="230" y2="222" stroke="#2e8b57" stroke-width="2.5" marker-end="url(#arrg)"/><rect x="88" y="285" width="130" height="34" rx="17" fill="#ffffff" stroke="#3b6ea5" stroke-width="2.5"/><text x="153" y="307" font-family="Menlo, Consolas, monospace" font-size="12.5" font-weight="bold" fill="#3b6ea5" text-anchor="middle">@challenger</text><line x1="218" y1="302" x2="230" y2="302" stroke="#3b6ea5" stroke-width="2.5" marker-end="url(#arrb)"/><text x="84" y="470" font-family="Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#1f2430" text-anchor="start">register_if_good -&gt; v8</text><text x="84" y="490" font-family="Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#1f2430" text-anchor="start">set_registered_model_alias(</text><text x="84" y="506" font-family="Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#1f2430" text-anchor="start">  name, "challenger", 8)</text><rect x="618" y="200" width="190" height="44" rx="8" fill="#f2f3f5" stroke="#9aa1ab" stroke-width="2"/><text x="632" y="228" font-family="Menlo, Consolas, monospace" font-size="13.5" font-weight="bold" fill="#1f2430" text-anchor="start">version 7</text><text x="794" y="228" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#9aa1ab" text-anchor="end">idle</text><rect x="618" y="280" width="190" height="44" rx="8" fill="#e8f5ec" stroke="#2e8b57" stroke-width="2"/><text x="632" y="308" font-family="Menlo, Consolas, monospace" font-size="13.5" font-weight="bold" fill="#1f2430" text-anchor="start">version 8</text><text x="794" y="308" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#2e8b57" text-anchor="end">serving</text><rect x="618" y="360" width="190" height="44" rx="8" fill="#eaf1fb" stroke="#3b6ea5" stroke-width="2"/><text x="632" y="388" font-family="Menlo, Consolas, monospace" font-size="13.5" font-weight="bold" fill="#1f2430" text-anchor="start">version 9</text><text x="794" y="388" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#3b6ea5" text-anchor="end">candidate</text><rect x="472" y="285" width="130" height="34" rx="17" fill="#ffffff" stroke="#2e8b57" stroke-width="2.5"/><text x="537" y="307" font-family="Menlo, Consolas, monospace" font-size="12.5" font-weight="bold" fill="#2e8b57" text-anchor="middle">@champion</text><line x1="602" y1="302" x2="614" y2="302" stroke="#2e8b57" stroke-width="2.5" marker-end="url(#arrg)"/><rect x="472" y="365" width="130" height="34" rx="17" fill="#ffffff" stroke="#3b6ea5" stroke-width="2.5"/><text x="537" y="387" font-family="Menlo, Consolas, monospace" font-size="12.5" font-weight="bold" fill="#3b6ea5" text-anchor="middle">@challenger</text><line x1="602" y1="382" x2="614" y2="382" stroke="#3b6ea5" stroke-width="2.5" marker-end="url(#arrb)"/><path d="M 538 283 C 538 250, 538 230, 538 222" stroke="#2e8b57" stroke-width="2" fill="none" stroke-dasharray="4 3"/><text x="548" y="248" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#2e8b57" text-anchor="start">moved from v7</text><text x="468" y="470" font-family="Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#1f2430" text-anchor="start">promote_challenger:</text><text x="468" y="490" font-family="Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#1f2430" text-anchor="start">set_registered_model_alias(</text><text x="468" y="506" font-family="Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#1f2430" text-anchor="start">  name, "champion", 8)  -&gt; serving reloads</text><rect x="1002" y="200" width="190" height="44" rx="8" fill="#f2f3f5" stroke="#9aa1ab" stroke-width="2"/><text x="1016" y="228" font-family="Menlo, Consolas, monospace" font-size="13.5" font-weight="bold" fill="#1f2430" text-anchor="start">version 7</text><text x="1178" y="228" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#9aa1ab" text-anchor="end">idle</text><rect x="1002" y="280" width="190" height="44" rx="8" fill="#e8f5ec" stroke="#2e8b57" stroke-width="2"/><text x="1016" y="308" font-family="Menlo, Consolas, monospace" font-size="13.5" font-weight="bold" fill="#1f2430" text-anchor="start">version 8</text><text x="1178" y="308" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#2e8b57" text-anchor="end">serving</text><rect x="1002" y="360" width="190" height="44" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="2"/><text x="1016" y="388" font-family="Menlo, Consolas, monospace" font-size="13.5" font-weight="bold" fill="#1f2430" text-anchor="start">version 9</text><text x="1178" y="388" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#c0392b" text-anchor="end">bad</text><rect x="856" y="285" width="130" height="34" rx="17" fill="#ffffff" stroke="#2e8b57" stroke-width="2.5"/><text x="921" y="307" font-family="Menlo, Consolas, monospace" font-size="12.5" font-weight="bold" fill="#2e8b57" text-anchor="middle">@champion</text><line x1="986" y1="302" x2="998" y2="302" stroke="#2e8b57" stroke-width="2.5" marker-end="url(#arrg)"/><rect x="856" y="365" width="130" height="34" rx="17" fill="#ffffff" stroke="#3b6ea5" stroke-width="2.5"/><text x="921" y="387" font-family="Menlo, Consolas, monospace" font-size="12.5" font-weight="bold" fill="#3b6ea5" text-anchor="middle">@challenger</text><line x1="986" y1="382" x2="998" y2="382" stroke="#3b6ea5" stroke-width="2.5" marker-end="url(#arrb)"/><text x="1097" y="424" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">ROUGE-L 0.33, gate failed</text><text x="852" y="470" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#1f2430" text-anchor="start">gate blocked promotion; v8 kept serving.</text><text x="852" y="490" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5a6270" text-anchor="start">Had v9 been promoted by mistake:</text><text x="852" y="506" font-family="Menlo, Consolas, monospace" font-size="11.5" font-weight="normal" fill="#1f2430" text-anchor="start">set_registered_model_alias(name,"champion",8)</text><rect x="64" y="540" width="1152" height="150" rx="10" fill="#fdf3e0" stroke="#c07d1a" stroke-width="2"/><text x="84" y="566" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#c07d1a" text-anchor="start">Why pointers beat stages</text><text x="84" y="590" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1f2430" text-anchor="start">An alias names exactly one version. Moving it is one metadata write; no image rebuild, no redeploy pipeline. The serving process</text><text x="84" y="608" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1f2430" text-anchor="start">picks up the new target on its next load (the Week 7 FastAPI service loads at startup: restart or reload endpoint, never rebuild).</text><text x="84" y="634" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#5a6270" text-anchor="start">transition_model_version_stage and get_latest_versions(stages=) still run on MLflow 3.15.1 but warn: deprecated since 2.9.0,</text><text x="84" y="652" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#5a6270" text-anchor="start">stages will be removed. models:/name@champion is the load URI. log_model takes name=, not artifact_path=.</text><text x="84" y="678" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1f2430" text-anchor="start">Record prev_v when you promote. Rollback is then one command, not archaeology.</text></svg>