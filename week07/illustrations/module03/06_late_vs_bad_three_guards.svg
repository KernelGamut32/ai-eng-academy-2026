<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720"><defs><marker id="arr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#5a6270"/></marker><marker id="arrg" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#2e8b57"/></marker><marker id="arrr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#c0392b"/></marker><marker id="arrb" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#3b6ea5"/></marker><marker id="arrk" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#1f2430"/></marker><marker id="arrp" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#6f4fa3"/></marker><marker id="arra" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#c07d1a"/></marker></defs><rect x="0" y="0" width="1280" height="720" fill="#ffffff"/><text x="64" y="58" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="bold" fill="#1f2430">Late Is Not Bad: Three Guards on One Monday</text><text x="64" y="88" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#5a6270">execution_timeout kills a task. DeadlineAlert notices a slow run. The quality gate catches a good-looking run with a worse model.</text><line x1="160" y1="300" x2="1200" y2="300" stroke="#9aa1ab" stroke-width="2"/><line x1="160.0" y1="295" x2="160.0" y2="305" stroke="#9aa1ab" stroke-width="2"/><text x="160.0" y="322" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5a6270" text-anchor="middle">02:00</text><line x1="290.0" y1="295" x2="290.0" y2="305" stroke="#9aa1ab" stroke-width="2"/><text x="290.0" y="322" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5a6270" text-anchor="middle">03:00</text><line x1="420.0" y1="295" x2="420.0" y2="305" stroke="#9aa1ab" stroke-width="2"/><text x="420.0" y="322" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5a6270" text-anchor="middle">04:00</text><line x1="550.0" y1="295" x2="550.0" y2="305" stroke="#9aa1ab" stroke-width="2"/><text x="550.0" y="322" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5a6270" text-anchor="middle">05:00</text><line x1="680.0" y1="295" x2="680.0" y2="305" stroke="#9aa1ab" stroke-width="2"/><text x="680.0" y="322" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5a6270" text-anchor="middle">06:00</text><line x1="810.0" y1="295" x2="810.0" y2="305" stroke="#9aa1ab" stroke-width="2"/><text x="810.0" y="322" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5a6270" text-anchor="middle">07:00</text><line x1="940.0" y1="295" x2="940.0" y2="305" stroke="#9aa1ab" stroke-width="2"/><text x="940.0" y="322" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5a6270" text-anchor="middle">08:00</text><line x1="1070.0" y1="295" x2="1070.0" y2="305" stroke="#9aa1ab" stroke-width="2"/><text x="1070.0" y="322" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5a6270" text-anchor="middle">09:00</text><line x1="1200.0" y1="295" x2="1200.0" y2="305" stroke="#9aa1ab" stroke-width="2"/><text x="1200.0" y="322" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5a6270" text-anchor="middle">10:00</text><text x="160" y="116" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#1f2430" text-anchor="start">Mon Sep 14, run queued 02:00:05</text><text x="64" y="160" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1f2430" text-anchor="start">Normal week</text><rect x="160.0" y="146" width="32.5" height="30" rx="4" fill="#f2f3f5" stroke="#9aa1ab" stroke-width="2"/><text x="176.25" y="166" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#9aa1ab" text-anchor="middle">pull</text><rect x="192.5" y="146" width="32.5" height="30" rx="4" fill="#f2f3f5" stroke="#9aa1ab" stroke-width="2"/><text x="208.75" y="166" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#9aa1ab" text-anchor="middle">prep</text><rect x="225.0" y="146" width="162.5" height="30" rx="4" fill="#eaf1fb" stroke="#3b6ea5" stroke-width="2"/><text x="306.25" y="166" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#3b6ea5" text-anchor="middle">train</text><rect x="387.5" y="146" width="32.5" height="30" rx="4" fill="#eaf1fb" stroke="#3b6ea5" stroke-width="2"/><text x="403.75" y="166" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#3b6ea5" text-anchor="middle">eval</text><rect x="420.0" y="146" width="22.099999999999966" height="30" rx="4" fill="#e8f5ec" stroke="#2e8b57" stroke-width="2"/><text x="431.04999999999995" y="166" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#2e8b57" text-anchor="middle">gate</text><text x="459.0" y="166" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#2e8b57" text-anchor="start">done 04:10; nothing fires</text><text x="64" y="220" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1f2430" text-anchor="start">Slow week</text><rect x="160.0" y="206" width="32.5" height="30" rx="4" fill="#f2f3f5" stroke="#9aa1ab" stroke-width="2"/><text x="176.25" y="226" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#9aa1ab" text-anchor="middle">pull</text><rect x="192.5" y="206" width="32.5" height="30" rx="4" fill="#f2f3f5" stroke="#9aa1ab" stroke-width="2"/><text x="208.75" y="226" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#9aa1ab" text-anchor="middle">prep</text><rect x="225.0" y="206" width="780.0" height="30" rx="4" fill="#fdf3e0" stroke="#c07d1a" stroke-width="2"/><text x="615.0" y="226" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#c07d1a" text-anchor="middle">train (stuck on a swap-thrashing Mac; still running at 06:00 and at 08:30)</text><line x1="680.0" y1="120" x2="680.0" y2="300" stroke="#6f4fa3" stroke-width="3" stroke-dasharray="8 5"/><text x="686.0" y="258" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#6f4fa3" text-anchor="start">06:00:05 DeadlineAlert fires:</text><text x="686.0" y="274" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#6f4fa3" text-anchor="start">QUEUED_AT + 4h, run not terminal</text><line x1="1005.0" y1="120" x2="1005.0" y2="300" stroke="#c0392b" stroke-width="3" stroke-dasharray="8 5"/><text x="1011.0" y="258" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start">08:30 execution_timeout=6h</text><text x="1011.0" y="274" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#c0392b" text-anchor="start">kills the train attempt</text><text x="64" y="352" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1f2430" text-anchor="start">Bad week</text><text x="64" y="368" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#5a6270" text-anchor="start">on time, bad</text><rect x="160.0" y="346" width="32.5" height="30" rx="4" fill="#f2f3f5" stroke="#9aa1ab" stroke-width="2"/><text x="176.25" y="366" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#9aa1ab" text-anchor="middle">pull</text><rect x="192.5" y="346" width="32.5" height="30" rx="4" fill="#f2f3f5" stroke="#9aa1ab" stroke-width="2"/><text x="208.75" y="366" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#9aa1ab" text-anchor="middle">prep</text><rect x="225.0" y="346" width="162.5" height="30" rx="4" fill="#eaf1fb" stroke="#3b6ea5" stroke-width="2"/><text x="306.25" y="366" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#3b6ea5" text-anchor="middle">train</text><rect x="387.5" y="346" width="32.5" height="30" rx="4" fill="#eaf1fb" stroke="#3b6ea5" stroke-width="2"/><text x="403.75" y="366" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#3b6ea5" text-anchor="middle">eval</text><rect x="420.0" y="346" width="32.5" height="30" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="2"/><text x="436.25" y="366" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">gate</text><text x="472.0" y="360" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start">ROUGE-L 0.33 &lt; 0.38: branch to alert_quality_regression.</text><text x="472.0" y="376" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#1f2430" text-anchor="start">No deadline, no timeout would ever see this. Only the gate.</text><rect x="64" y="410" width="384" height="170" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="2"/><text x="82" y="438" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="bold" fill="#c0392b" text-anchor="start">execution_timeout</text><text x="82" y="460" font-family="Menlo, Consolas, monospace" font-size="11.5" font-weight="normal" fill="#1f2430" text-anchor="start">timedelta(hours=6) in default_args</text><text x="82" y="490" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1f2430" text-anchor="start">Scope: one task attempt</text><text x="82" y="512" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1f2430" text-anchor="start">Action: kill it, consume a retry</text><text x="82" y="534" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#1f2430" text-anchor="start">Catches: a hung process</text><text x="82" y="562" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#5a6270" text-anchor="start">From Airflow 2: unchanged</text><rect x="448" y="410" width="384" height="170" rx="10" fill="#f1ecfa" stroke="#6f4fa3" stroke-width="2"/><text x="466" y="438" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="bold" fill="#6f4fa3" text-anchor="start">DeadlineAlert</text><text x="466" y="460" font-family="Menlo, Consolas, monospace" font-size="11.5" font-weight="normal" fill="#1f2430" text-anchor="start">DAGRUN_QUEUED_AT + 4h, SyncCallback</text><text x="466" y="490" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1f2430" text-anchor="start">Scope: the whole DagRun</text><text x="466" y="512" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1f2430" text-anchor="start">Action: notify; run keeps going</text><text x="466" y="534" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#1f2430" text-anchor="start">Catches: a slow week</text><text x="466" y="562" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#5a6270" text-anchor="start">From Airflow 2: sla= is now a silent no-op</text><rect x="832" y="410" width="384" height="170" rx="10" fill="#e8f5ec" stroke="#2e8b57" stroke-width="2"/><text x="850" y="438" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="bold" fill="#2e8b57" text-anchor="start">quality_gate (@task.branch)</text><text x="850" y="460" font-family="Menlo, Consolas, monospace" font-size="11.5" font-weight="normal" fill="#1f2430" text-anchor="start">rouge_l &gt;= ROUGE_MIN and tox &lt;= TOX_MAX</text><text x="850" y="490" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1f2430" text-anchor="start">Scope: the model itself</text><text x="850" y="512" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1f2430" text-anchor="start">Action: branch to alert, block promote</text><text x="850" y="534" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#1f2430" text-anchor="start">Catches: a bad week</text><text x="850" y="562" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#5a6270" text-anchor="start">From Airflow 2: BranchPythonOperator</text><rect x="64" y="600" width="1152" height="90" rx="10" fill="#fdf3e0" stroke="#c07d1a" stroke-width="2"/><text x="84" y="626" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1f2430" text-anchor="start">Ported sla=timedelta(hours=4) parses, runs, warns once at parse, and never alerts. Executed on 3.3.1: the operator has no sla attribute afterward.</text><text x="84" y="648" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1f2430" text-anchor="start">The Thursday discovery that ROUGE fell on Monday is a missing gate alert, not a missing deadline. Wire the callback to the alert branch.</text><text x="84" y="674" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#c07d1a" text-anchor="start">Three guards, three questions: is a task hung, is the run slow, is the model worse. Each needs its own answer.</text></svg>