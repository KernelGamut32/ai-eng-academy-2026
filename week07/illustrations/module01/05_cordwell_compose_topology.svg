<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720"><defs>
<marker id="arr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#5a6270"/></marker>
<marker id="arrg" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#2e8b57"/></marker>
<marker id="arrr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#c0392b"/></marker>
<marker id="arrb" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#3b6ea5"/></marker>
</defs><rect x="0" y="0" width="1280" height="720" fill="#ffffff"/><text x="64" y="58" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="bold" fill="#1f2430">The Cordwell RAG Stack: Who Can Talk to Whom</text><text x="64" y="88" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#5a6270">Four Compose services, one published port, one bridge to the host model.</text><rect x="64" y="112" width="1152" height="470" rx="16" fill="#fbfbfd" stroke="#1f2430" stroke-width="2.5"/><text x="88" y="142" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#1f2430" text-anchor="start">Your Mac</text><rect x="96" y="160" width="700" height="400" rx="12" fill="#f4f7fb" stroke="#3b6ea5" stroke-width="2" stroke-dasharray="8 5"/><text x="116" y="188" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="bold" fill="#3b6ea5" text-anchor="start">Private Compose network (DNS by service name)</text><rect x="128" y="212" width="300" height="96" rx="10" fill="#ffffff" stroke="#3b6ea5" stroke-width="2.5"/><text x="148" y="240" font-family="Helvetica, Arial, sans-serif" font-size="15.5" font-weight="bold" fill="#1f2430" text-anchor="start">api</text><text x="148" y="262" font-family="Menlo, Consolas, monospace" font-size="13" font-weight="normal" fill="#5a6270" text-anchor="start">container :5000</text><rect x="148" y="274" width="176" height="26" rx="13" fill="#e8f5ec" stroke="#2e8b57" stroke-width="2"/><text x="236" y="291" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#2e8b57" text-anchor="middle">published 5000:5000</text><rect x="496" y="212" width="272" height="84" rx="10" fill="#ffffff" stroke="#9aa1ab" stroke-width="2"/><text x="516" y="240" font-family="Helvetica, Arial, sans-serif" font-size="15.5" font-weight="bold" fill="#1f2430" text-anchor="start">embedder</text><text x="516" y="262" font-family="Menlo, Consolas, monospace" font-size="13" font-weight="normal" fill="#5a6270" text-anchor="start">http://embedder:8000</text><text x="516" y="282" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#c07d1a" text-anchor="start">internal only</text><rect x="496" y="330" width="272" height="96" rx="10" fill="#ffffff" stroke="#9aa1ab" stroke-width="2"/><text x="516" y="358" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1f2430" text-anchor="start">pinecone (Pinecone Local)</text><text x="516" y="380" font-family="Menlo, Consolas, monospace" font-size="13" font-weight="normal" fill="#5a6270" text-anchor="start">http://pinecone.local:5080</text><text x="516" y="400" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#c07d1a" text-anchor="start">alias needed: client wants a dot</text><rect x="496" y="452" width="272" height="84" rx="10" fill="#ffffff" stroke="#9aa1ab" stroke-width="2"/><text x="516" y="480" font-family="Helvetica, Arial, sans-serif" font-size="15.5" font-weight="bold" fill="#1f2430" text-anchor="start">llm</text><text x="516" y="502" font-family="Menlo, Consolas, monospace" font-size="13" font-weight="normal" fill="#5a6270" text-anchor="start">http://llm:8000</text><text x="516" y="522" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#c07d1a" text-anchor="start">internal only</text><rect x="880" y="300" width="304" height="120" rx="10" fill="#e8f5ec" stroke="#2e8b57" stroke-width="2"/><text x="900" y="330" font-family="Helvetica, Arial, sans-serif" font-size="15.5" font-weight="bold" fill="#1f2430" text-anchor="start">Ollama on the host</text><text x="900" y="354" font-family="Menlo, Consolas, monospace" font-size="13.5" font-weight="bold" fill="#2e8b57" text-anchor="start">host.docker.internal:11434</text><text x="900" y="378" font-family="Menlo, Consolas, monospace" font-size="13" font-weight="normal" fill="#1f2430" text-anchor="start">MODEL=gemma4</text><text x="900" y="400" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5a6270" text-anchor="start">confirm pulled tag before class</text><rect x="880" y="150" width="304" height="84" rx="10" fill="#f2f3f5" stroke="#9aa1ab" stroke-width="2"/><text x="900" y="178" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="bold" fill="#1f2430" text-anchor="start">Store associate's browser</text><text x="900" y="202" font-family="Menlo, Consolas, monospace" font-size="13.5" font-weight="normal" fill="#1f2430" text-anchor="start">http://localhost:5000</text><path d="M 876 186 C 700 130, 400 140, 282 208" stroke="#1f2430" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><text x="600" y="142" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1f2430" text-anchor="middle">1</text><line x1="428" y1="244" x2="492" y2="250" stroke="#3b6ea5" stroke-width="2.5" marker-end="url(#arrb)"/><text x="462" y="236" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#3b6ea5" text-anchor="middle">2</text><line x1="428" y1="280" x2="492" y2="366" stroke="#3b6ea5" stroke-width="2.5" marker-end="url(#arrb)"/><text x="448" y="330" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#3b6ea5" text-anchor="middle">3</text><line x1="428" y1="300" x2="492" y2="486" stroke="#3b6ea5" stroke-width="2.5" marker-end="url(#arrb)"/><text x="436" y="420" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#3b6ea5" text-anchor="middle">4</text><path d="M 768 480 C 840 480, 840 380, 876 372" stroke="#2e8b57" stroke-width="3" fill="none" marker-end="url(#arrg)"/><text x="830" y="452" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#2e8b57" text-anchor="middle">5</text><text x="64" y="626" font-family="Helvetica, Arial, sans-serif" font-size="15.5" font-weight="bold" fill="#1f2430" text-anchor="start">Only port 5000 crosses the boundary to your Mac. Steps 2 to 4 travel by service name on the private network.</text><text x="64" y="652" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#5a6270" text-anchor="start">Step 5 leaves every container: the llm service calls the model running natively on the host. GPU never assumed, CPU services stay light.</text><text x="64" y="678" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#5a6270" text-anchor="start">pinecone runs the amd64 Pinecone Local image under emulation on Apple silicon: slower, but faithful.</text></svg>