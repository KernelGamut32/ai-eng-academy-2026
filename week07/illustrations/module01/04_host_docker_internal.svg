<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720"><defs>
<marker id="arr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#5a6270"/></marker>
<marker id="arrg" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#2e8b57"/></marker>
<marker id="arrr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#c0392b"/></marker>
<marker id="arrb" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#3b6ea5"/></marker>
</defs><rect x="0" y="0" width="1280" height="720" fill="#ffffff"/><text x="64" y="58" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="bold" fill="#1f2430">host.docker.internal: The Bridge to the Host Model</text><text x="64" y="88" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#5a6270">Inference runs natively on the Mac. The container reaches it by name, never by IP.</text><rect x="64" y="112" width="1152" height="500" rx="16" fill="#fbfbfd" stroke="#1f2430" stroke-width="2.5"/><text x="88" y="144" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#1f2430" text-anchor="start">Your Mac (the host)</text><rect x="96" y="168" width="560" height="268" rx="12" fill="#f4f7fb" stroke="#3b6ea5" stroke-width="2" stroke-dasharray="8 5"/><text x="116" y="198" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#3b6ea5" text-anchor="start">Docker Desktop Linux VM</text><rect x="128" y="220" width="496" height="200" rx="10" fill="#ffffff" stroke="#3b6ea5" stroke-width="2.5"/><text x="148" y="250" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1f2430" text-anchor="start">review-summarizer container</text><text x="148" y="276" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#5a6270" text-anchor="start">listens on container port 8000</text><rect x="148" y="292" width="456" height="112" rx="8" fill="#23262e" stroke="#23262e" stroke-width="2"/><text x="166" y="318" font-family="Menlo, Consolas, monospace" font-size="13.5" font-weight="normal" fill="#e8eaef" text-anchor="start">BACKEND_MODE=ollama</text><text x="166" y="342" font-family="Menlo, Consolas, monospace" font-size="13.5" font-weight="normal" fill="#e8eaef" text-anchor="start">OLLAMA_BASE_URL=</text><text x="166" y="364" font-family="Menlo, Consolas, monospace" font-size="13.5" font-weight="normal" fill="#8fd0a0" text-anchor="start">  http://host.docker.internal:11434</text><text x="166" y="388" font-family="Menlo, Consolas, monospace" font-size="13.5" font-weight="normal" fill="#e8eaef" text-anchor="start">MODEL=gemma4</text><rect x="732" y="200" width="440" height="108" rx="10" fill="#e8f5ec" stroke="#2e8b57" stroke-width="2"/><text x="752" y="230" font-family="Helvetica, Arial, sans-serif" font-size="15.5" font-weight="bold" fill="#1f2430" text-anchor="start">Ollama server (native process)</text><text x="752" y="256" font-family="Menlo, Consolas, monospace" font-size="14" font-weight="bold" fill="#2e8b57" text-anchor="start">127.0.0.1:11434</text><text x="752" y="282" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#5a6270" text-anchor="start">OLLAMA_HOST=0.0.0.0 so the VM can reach it</text><rect x="732" y="330" width="440" height="88" rx="10" fill="#e8f5ec" stroke="#2e8b57" stroke-width="2"/><text x="752" y="360" font-family="Helvetica, Arial, sans-serif" font-size="15.5" font-weight="bold" fill="#1f2430" text-anchor="start">LM Studio server (native process)</text><text x="752" y="386" font-family="Menlo, Consolas, monospace" font-size="14" font-weight="bold" fill="#2e8b57" text-anchor="start">127.0.0.1:1234</text><path d="M 624 330 C 690 330, 680 254, 728 254" stroke="#2e8b57" stroke-width="3" fill="none" marker-end="url(#arrg)"/><text x="672" y="356" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#2e8b57" text-anchor="middle">by DNS name</text><rect x="732" y="448" width="440" height="108" rx="10" fill="#fdf3e0" stroke="#c07d1a" stroke-width="2"/><text x="752" y="476" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#c07d1a" text-anchor="start">Swap backends with env vars only:</text><text x="752" y="500" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#1f2430" text-anchor="start">BACKEND_MODE=lmstudio, port 1234.</text><text x="752" y="522" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#1f2430" text-anchor="start">Same image, same code path, no rebuild.</text><text x="752" y="544" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#1f2430" text-anchor="start">Down server raises a clear connection error.</text><rect x="96" y="468" width="560" height="96" rx="10" fill="#f2f3f5" stroke="#9aa1ab" stroke-width="2"/><text x="116" y="498" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="bold" fill="#1f2430" text-anchor="start">Your terminal or browser on the Mac (outside the VM)</text><text x="116" y="522" font-family="Menlo, Consolas, monospace" font-size="13.5" font-weight="normal" fill="#1f2430" text-anchor="start">curl http://localhost:8000/summarize</text><text x="116" y="546" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#5a6270" text-anchor="start">reaches the container through -p 8000:8000</text><line x1="376" y1="464" x2="376" y2="424" stroke="#3b6ea5" stroke-width="3" marker-end="url(#arrb)"/><text x="392" y="452" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#3b6ea5" text-anchor="start">published port</text><text x="64" y="654" font-family="Helvetica, Arial, sans-serif" font-size="15.5" font-weight="bold" fill="#1f2430" text-anchor="start">Two doors, two directions: -p publishes the container to the Mac; host.docker.internal lets the container call back out to the Mac.</text><text x="64" y="680" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#5a6270" text-anchor="start">Containers reach the host by name, not IP. The VM boundary is why localhost inside the container is not your Mac.</text></svg>