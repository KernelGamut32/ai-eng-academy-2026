<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720"><defs>
<marker id="arr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#5a6270"/></marker>
<marker id="arrg" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#2e8b57"/></marker>
<marker id="arrr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#c0392b"/></marker>
<marker id="arrb" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#3b6ea5"/></marker>
</defs><rect x="0" y="0" width="1280" height="720" fill="#ffffff"/><text x="64" y="58" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="bold" fill="#1f2430">started Is Not ready: The Readiness Gate</text><text x="64" y="88" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#5a6270">Two runs of the same stack. Only the healthcheck knows when the database can actually answer.</text><line x1="140" y1="620" x2="1180" y2="620" stroke="#9aa1ab" stroke-width="2"/><line x1="140.0" y1="615" x2="140.0" y2="625" stroke="#9aa1ab" stroke-width="2"/><text x="140.0" y="646" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#5a6270" text-anchor="middle">0s</text><line x1="270.0" y1="615" x2="270.0" y2="625" stroke="#9aa1ab" stroke-width="2"/><text x="270.0" y="646" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#5a6270" text-anchor="middle">5s</text><line x1="400.0" y1="615" x2="400.0" y2="625" stroke="#9aa1ab" stroke-width="2"/><text x="400.0" y="646" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#5a6270" text-anchor="middle">10s</text><line x1="530.0" y1="615" x2="530.0" y2="625" stroke="#9aa1ab" stroke-width="2"/><text x="530.0" y="646" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#5a6270" text-anchor="middle">15s</text><line x1="660.0" y1="615" x2="660.0" y2="625" stroke="#9aa1ab" stroke-width="2"/><text x="660.0" y="646" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#5a6270" text-anchor="middle">20s</text><line x1="790.0" y1="615" x2="790.0" y2="625" stroke="#9aa1ab" stroke-width="2"/><text x="790.0" y="646" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#5a6270" text-anchor="middle">25s</text><line x1="920.0" y1="615" x2="920.0" y2="625" stroke="#9aa1ab" stroke-width="2"/><text x="920.0" y="646" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#5a6270" text-anchor="middle">30s</text><line x1="1050.0" y1="615" x2="1050.0" y2="625" stroke="#9aa1ab" stroke-width="2"/><text x="1050.0" y="646" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#5a6270" text-anchor="middle">35s</text><line x1="1180.0" y1="615" x2="1180.0" y2="625" stroke="#9aa1ab" stroke-width="2"/><text x="1180.0" y="646" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#5a6270" text-anchor="middle">40s</text><text x="64" y="158" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#1f2430" text-anchor="start">Run A: depends_on with service_started</text><text x="64" y="182" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#5a6270" text-anchor="start">api launches the moment the db container exists</text><rect x="166.0" y="200" width="260.0" height="40" rx="6" fill="#fdf3e0" stroke="#c07d1a" stroke-width="2"/><text x="296.0" y="225" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#c07d1a" text-anchor="middle">db initializing</text><rect x="426.0" y="200" width="754.0" height="40" rx="6" fill="#e8f5ec" stroke="#2e8b57" stroke-width="2"/><text x="803.0" y="225" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#2e8b57" text-anchor="middle">db ready at t = 11s</text><rect x="166.0" y="256" width="39.0" height="40" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2"/><line x1="209.0" y1="276" x2="280.4" y2="276" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrr)"/><text x="296.0" y="281" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#c0392b" text-anchor="start">api starts at t = 1s, first query at t = 2s: connection refused, container exits</text><text x="64" y="356" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#1f2430" text-anchor="start">Run B: healthcheck with condition: service_healthy</text><text x="64" y="380" font-family="Menlo, Consolas, monospace" font-size="13.5" font-weight="normal" fill="#5a6270" text-anchor="start">interval: 5s, timeout: 5s, retries: 5, start_period: 10s</text><rect x="166.0" y="398" width="260.0" height="40" rx="6" fill="#fdf3e0" stroke="#c07d1a" stroke-width="2"/><text x="296.0" y="423" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#c07d1a" text-anchor="middle">db initializing</text><rect x="426.0" y="398" width="754.0" height="40" rx="6" fill="#e8f5ec" stroke="#2e8b57" stroke-width="2"/><text x="803.0" y="423" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#2e8b57" text-anchor="middle">db ready</text><line x1="270.0" y1="446" x2="270.0" y2="470" stroke="#c07d1a" stroke-width="3"/><text x="270.0" y="488" font-family="Menlo, Consolas, monospace" font-size="11.5" font-weight="bold" fill="#c07d1a" text-anchor="middle">pg_isready</text><text x="270.0" y="504" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#c07d1a" text-anchor="middle">not yet</text><line x1="400.0" y1="446" x2="400.0" y2="470" stroke="#c07d1a" stroke-width="3"/><text x="400.0" y="488" font-family="Menlo, Consolas, monospace" font-size="11.5" font-weight="bold" fill="#c07d1a" text-anchor="middle">pg_isready</text><text x="400.0" y="504" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#c07d1a" text-anchor="middle">not yet</text><line x1="530.0" y1="446" x2="530.0" y2="470" stroke="#2e8b57" stroke-width="3"/><text x="530.0" y="488" font-family="Menlo, Consolas, monospace" font-size="11.5" font-weight="bold" fill="#2e8b57" text-anchor="middle">pg_isready</text><text x="530.0" y="504" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#2e8b57" text-anchor="middle">healthy</text><rect x="530.0" y="520" width="234.0" height="40" rx="6" fill="#e8f5ec" stroke="#2e8b57" stroke-width="2"/><text x="538.0" y="545" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#2e8b57" text-anchor="start">api starts at t = 15s</text><line x1="768.0" y1="540" x2="842.0" y2="540" stroke="#2e8b57" stroke-width="2.5" marker-end="url(#arrg)"/><text x="857.6" y="545" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#2e8b57" text-anchor="start">first request succeeds</text><text x="790" y="148" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2430" text-anchor="start">Worst case before unhealthy is declared:</text><text x="790" y="170" font-family="Menlo, Consolas, monospace" font-size="13" font-weight="normal" fill="#1f2430" text-anchor="start">start_period + interval x retries = 10s + 5s x 5 = 35s</text><text x="790" y="190" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#5a6270" text-anchor="start">Failed checks inside start_period do not count.</text><text x="64" y="688" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1f2430" text-anchor="start">depends_on orders containers. The service_healthy condition orders services. Databases and vector stores need the second one.</text></svg>