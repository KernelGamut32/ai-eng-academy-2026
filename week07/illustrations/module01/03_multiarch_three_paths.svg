<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720"><defs>
<marker id="arr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#5a6270"/></marker>
<marker id="arrg" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#2e8b57"/></marker>
<marker id="arrr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#c0392b"/></marker>
<marker id="arrb" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#3b6ea5"/></marker>
</defs><rect x="0" y="0" width="1280" height="720" fill="#ffffff"/><text x="64" y="58" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="bold" fill="#1f2430">arm64 to amd64: Three Paths, One Safe Habit</text><text x="64" y="88" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#5a6270">Your Mac builds linux-arm64 by default. The cloud target runs linux-amd64. Pick the platform on purpose.</text><rect x="64" y="150" width="560" height="64" rx="8" fill="#23262e" stroke="#23262e" stroke-width="2"/><text x="84" y="188" font-family="Menlo, Consolas, monospace" font-size="14.5" font-weight="normal" fill="#e8eaef" text-anchor="start">docker build -t review-summarizer:v1 .</text><text x="64" y="238" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#5a6270" text-anchor="start">Default path. Builds clean, dies on deploy.</text><line x1="624" y1="182" x2="664" y2="182" stroke="#5a6270" stroke-width="2.5" marker-end="url(#arr)"/><rect x="668" y="154" width="220" height="56" rx="10" fill="#f2f3f5" stroke="#9aa1ab" stroke-width="2"/><text x="778" y="188" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="bold" fill="#1f2430" text-anchor="middle">Image: linux/arm64</text><line x1="888" y1="182" x2="928" y2="182" stroke="#5a6270" stroke-width="2.5" marker-end="url(#arr)"/><rect x="932" y="154" width="168" height="56" rx="10" fill="#f2f3f5" stroke="#9aa1ab" stroke-width="2"/><text x="1016" y="188" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#1f2430" text-anchor="middle">amd64 cloud host</text><line x1="1100" y1="182" x2="1128" y2="182" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrr)"/><rect x="1108" y="224" width="158" height="46" rx="22" fill="#fdecea" stroke="#c0392b" stroke-width="2"/><text x="1187" y="252" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">exec format error</text><rect x="64" y="340" width="560" height="64" rx="8" fill="#23262e" stroke="#23262e" stroke-width="2"/><text x="84" y="378" font-family="Menlo, Consolas, monospace" font-size="14.5" font-weight="normal" fill="#e8eaef" text-anchor="start">docker buildx build --platform linux/amd64 --load .</text><text x="64" y="428" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#5a6270" text-anchor="start">Single target, lands in your local daemon via --load.</text><line x1="624" y1="372" x2="664" y2="372" stroke="#5a6270" stroke-width="2.5" marker-end="url(#arr)"/><rect x="668" y="344" width="220" height="56" rx="10" fill="#eaf1fb" stroke="#3b6ea5" stroke-width="2"/><text x="778" y="378" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="bold" fill="#1f2430" text-anchor="middle">Image: linux/amd64</text><line x1="888" y1="372" x2="928" y2="372" stroke="#5a6270" stroke-width="2.5" marker-end="url(#arr)"/><rect x="932" y="344" width="168" height="56" rx="10" fill="#f2f3f5" stroke="#9aa1ab" stroke-width="2"/><text x="1016" y="378" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#1f2430" text-anchor="middle">amd64 cloud host</text><line x1="1100" y1="372" x2="1128" y2="372" stroke="#2e8b57" stroke-width="2.5" marker-end="url(#arrg)"/><rect x="1108" y="414" width="158" height="46" rx="22" fill="#e8f5ec" stroke="#2e8b57" stroke-width="2"/><text x="1187" y="442" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#2e8b57" text-anchor="middle">starts and serves</text><rect x="64" y="530" width="560" height="64" rx="8" fill="#23262e" stroke="#23262e" stroke-width="2"/><text x="84" y="568" font-family="Menlo, Consolas, monospace" font-size="14.5" font-weight="normal" fill="#e8eaef" text-anchor="start">docker buildx build --platform linux/amd64,linux/arm64 --push .</text><text x="64" y="618" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#5a6270" text-anchor="start">Multi-arch must --push. Each host resolves its own binary.</text><line x1="624" y1="562" x2="664" y2="562" stroke="#5a6270" stroke-width="2.5" marker-end="url(#arr)"/><rect x="668" y="534" width="220" height="56" rx="10" fill="#eaf1fb" stroke="#3b6ea5" stroke-width="2"/><text x="778" y="568" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="bold" fill="#1f2430" text-anchor="middle">Registry manifest list</text><line x1="888" y1="562" x2="928" y2="562" stroke="#5a6270" stroke-width="2.5" marker-end="url(#arr)"/><rect x="932" y="534" width="168" height="56" rx="10" fill="#f2f3f5" stroke="#9aa1ab" stroke-width="2"/><text x="1016" y="568" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#1f2430" text-anchor="middle">any host pulls its match</text><line x1="1100" y1="562" x2="1128" y2="562" stroke="#2e8b57" stroke-width="2.5" marker-end="url(#arrg)"/><rect x="1108" y="604" width="158" height="46" rx="22" fill="#e8f5ec" stroke="#2e8b57" stroke-width="2"/><text x="1187" y="632" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#2e8b57" text-anchor="middle">right binary, both</text><text x="64" y="690" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#c0392b" text-anchor="start">The cohort's most likely real-world deployment bug lives on the first row.</text></svg>