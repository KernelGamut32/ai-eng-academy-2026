<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720"><defs>
<marker id="arr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#5a6270"/></marker>
<marker id="arrg" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#2e8b57"/></marker>
<marker id="arrr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#c0392b"/></marker>
<marker id="arrb" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#3b6ea5"/></marker>
</defs><rect x="0" y="0" width="1280" height="720" fill="#ffffff"/><text x="64" y="58" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="bold" fill="#1f2430">A venv Is Not Enough</text><text x="64" y="88" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#5a6270">What each tool actually isolates. The kernel is shared either way.</text><text x="120" y="132" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" fill="#1f2430" text-anchor="start">Virtual environment (venv)</text><rect x="100" y="152" width="430" height="58" rx="10" fill="#e8f5ec" stroke="#2e8b57" stroke-width="2"/><text x="118" y="187" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1f2430" text-anchor="start">Your app code</text><text x="512" y="187" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#2e8b57" text-anchor="end">isolated</text><rect x="100" y="218" width="430" height="58" rx="10" fill="#e8f5ec" stroke="#2e8b57" stroke-width="2"/><text x="118" y="253" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1f2430" text-anchor="start">Python packages</text><text x="512" y="253" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#2e8b57" text-anchor="end">isolated</text><rect x="100" y="284" width="430" height="58" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="2"/><text x="118" y="319" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1f2430" text-anchor="start">Python interpreter</text><text x="512" y="319" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#c0392b" text-anchor="end">host version</text><rect x="100" y="350" width="430" height="58" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="2"/><text x="118" y="385" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1f2430" text-anchor="start">System libraries + glibc</text><text x="512" y="385" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#c0392b" text-anchor="end">host version</text><rect x="100" y="416" width="430" height="58" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="2"/><text x="118" y="451" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1f2430" text-anchor="start">Config files, locales, tools</text><text x="512" y="451" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#c0392b" text-anchor="end">host version</text><text x="100" y="508" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#c0392b" text-anchor="start">Only the top two travel with you.</text><text x="100" y="528" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#c0392b" text-anchor="start">Everything below drifts per machine.</text><text x="764" y="132" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" fill="#1f2430" text-anchor="start">Container image</text><rect x="730" y="142" width="458" height="360" rx="14" fill="none" stroke="#3b6ea5" stroke-width="2.5" stroke-dasharray="7 5"/><rect x="744" y="152" width="430" height="58" rx="10" fill="#e8f5ec" stroke="#2e8b57" stroke-width="2"/><text x="762" y="187" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1f2430" text-anchor="start">Your app code</text><text x="1156" y="187" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#2e8b57" text-anchor="end">in the image</text><rect x="744" y="218" width="430" height="58" rx="10" fill="#e8f5ec" stroke="#2e8b57" stroke-width="2"/><text x="762" y="253" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1f2430" text-anchor="start">Python packages</text><text x="1156" y="253" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#2e8b57" text-anchor="end">in the image</text><rect x="744" y="284" width="430" height="58" rx="10" fill="#e8f5ec" stroke="#2e8b57" stroke-width="2"/><text x="762" y="319" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1f2430" text-anchor="start">Python 3.13-slim runtime</text><text x="1156" y="319" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#2e8b57" text-anchor="end">in the image</text><rect x="744" y="350" width="430" height="58" rx="10" fill="#e8f5ec" stroke="#2e8b57" stroke-width="2"/><text x="762" y="385" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1f2430" text-anchor="start">System libraries + glibc</text><text x="1156" y="385" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#2e8b57" text-anchor="end">in the image</text><rect x="744" y="416" width="430" height="58" rx="10" fill="#e8f5ec" stroke="#2e8b57" stroke-width="2"/><text x="762" y="451" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1f2430" text-anchor="start">Config files, locales</text><text x="1156" y="451" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#2e8b57" text-anchor="end">in the image</text><text x="744" y="522" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#2e8b57" text-anchor="start">One shippable unit. Same bytes on</text><text x="744" y="542" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#2e8b57" text-anchor="start">every laptop, in CI, in production.</text><rect x="100" y="596" width="1074" height="54" rx="10" fill="#f2f3f5" stroke="#9aa1ab" stroke-width="2"/><text x="640" y="629" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#5a6270" text-anchor="middle">Host OS kernel: shared by venv and container alike. That is why containers start in milliseconds.</text><rect x="536" y="300" width="176" height="96" rx="12" fill="#fdf3e0" stroke="#c07d1a" stroke-width="2"/><text x="624" y="330" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#c07d1a" text-anchor="middle">Lockfile ::</text><text x="624" y="350" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#c07d1a" text-anchor="middle">dependency tree</text><text x="624" y="372" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#c07d1a" text-anchor="middle">Container ::</text><text x="624" y="392" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#c07d1a" text-anchor="middle">entire runtime</text></svg>