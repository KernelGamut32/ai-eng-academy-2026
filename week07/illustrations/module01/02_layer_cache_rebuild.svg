<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720"><defs>
<marker id="arr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#5a6270"/></marker>
<marker id="arrg" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#2e8b57"/></marker>
<marker id="arrr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#c0392b"/></marker>
<marker id="arrb" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#3b6ea5"/></marker>
</defs><rect x="0" y="0" width="1280" height="720" fill="#ffffff"/><text x="64" y="58" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="bold" fill="#1f2430">Layer Cache: Where a Rebuild Starts</text><text x="64" y="88" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#5a6270">Docker rebuilds from the first changed layer down. Order layers cheapest-to-change last.</text><text x="72" y="150" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1f2430" text-anchor="start">Dockerfile, top to bottom</text><text x="760" y="128" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1f2430" text-anchor="middle">Scenario A</text><text x="760" y="150" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#5a6270" text-anchor="middle">edit app code only</text><text x="1040" y="128" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1f2430" text-anchor="middle">Scenario B</text><text x="1040" y="150" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#5a6270" text-anchor="middle">edit requirements.txt</text><rect x="72" y="178" width="500" height="60" rx="8" fill="#fbfbfd" stroke="#9aa1ab" stroke-width="2"/><text x="88" y="204" font-family="Menlo, Consolas, monospace" font-size="15" font-weight="bold" fill="#1f2430" text-anchor="start">FROM python:3.13-slim</text><text x="88" y="225" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#5a6270" text-anchor="start">base image</text><rect x="682" y="186" width="156" height="40" rx="20" fill="#e8f5ec" stroke="#2e8b57" stroke-width="2"/><text x="760" y="211" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#2e8b57" text-anchor="middle">cache HIT</text><rect x="962" y="186" width="156" height="40" rx="20" fill="#e8f5ec" stroke="#2e8b57" stroke-width="2"/><text x="1040" y="211" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#2e8b57" text-anchor="middle">cache HIT</text><line x1="96" y1="238" x2="96" y2="250" stroke="#9aa1ab" stroke-width="2" marker-end="url(#arr)"/><rect x="72" y="250" width="500" height="60" rx="8" fill="#fbfbfd" stroke="#9aa1ab" stroke-width="2"/><text x="88" y="276" font-family="Menlo, Consolas, monospace" font-size="15" font-weight="bold" fill="#1f2430" text-anchor="start">RUN apt-get install (system packages)</text><text x="88" y="297" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#5a6270" text-anchor="start">slowest to change</text><rect x="682" y="258" width="156" height="40" rx="20" fill="#e8f5ec" stroke="#2e8b57" stroke-width="2"/><text x="760" y="283" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#2e8b57" text-anchor="middle">cache HIT</text><rect x="962" y="258" width="156" height="40" rx="20" fill="#e8f5ec" stroke="#2e8b57" stroke-width="2"/><text x="1040" y="283" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#2e8b57" text-anchor="middle">cache HIT</text><line x1="96" y1="310" x2="96" y2="322" stroke="#9aa1ab" stroke-width="2" marker-end="url(#arr)"/><rect x="72" y="322" width="500" height="60" rx="8" fill="#fbfbfd" stroke="#9aa1ab" stroke-width="2"/><text x="88" y="348" font-family="Menlo, Consolas, monospace" font-size="15" font-weight="bold" fill="#1f2430" text-anchor="start">COPY requirements.txt .</text><text x="88" y="369" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#5a6270" text-anchor="start">occasional changes</text><rect x="682" y="330" width="156" height="40" rx="20" fill="#e8f5ec" stroke="#2e8b57" stroke-width="2"/><text x="760" y="355" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#2e8b57" text-anchor="middle">cache HIT</text><rect x="962" y="330" width="156" height="40" rx="20" fill="#fdecea" stroke="#c0392b" stroke-width="2"/><text x="1040" y="355" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#c0392b" text-anchor="middle">REBUILD</text><line x1="96" y1="382" x2="96" y2="394" stroke="#9aa1ab" stroke-width="2" marker-end="url(#arr)"/><rect x="72" y="394" width="500" height="60" rx="8" fill="#fbfbfd" stroke="#9aa1ab" stroke-width="2"/><text x="88" y="420" font-family="Menlo, Consolas, monospace" font-size="15" font-weight="bold" fill="#1f2430" text-anchor="start">RUN pip install -r requirements.txt</text><text x="88" y="441" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#5a6270" text-anchor="start">expensive: ~3.5 min</text><rect x="682" y="402" width="156" height="40" rx="20" fill="#e8f5ec" stroke="#2e8b57" stroke-width="2"/><text x="760" y="427" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#2e8b57" text-anchor="middle">cache HIT</text><rect x="962" y="402" width="156" height="40" rx="20" fill="#fdecea" stroke="#c0392b" stroke-width="2"/><text x="1040" y="427" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#c0392b" text-anchor="middle">REBUILD</text><line x1="96" y1="454" x2="96" y2="466" stroke="#9aa1ab" stroke-width="2" marker-end="url(#arr)"/><rect x="72" y="466" width="500" height="60" rx="8" fill="#fbfbfd" stroke="#9aa1ab" stroke-width="2"/><text x="88" y="492" font-family="Menlo, Consolas, monospace" font-size="15" font-weight="bold" fill="#1f2430" text-anchor="start">COPY app/ ./app/</text><text x="88" y="513" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#5a6270" text-anchor="start">changes most often</text><rect x="682" y="474" width="156" height="40" rx="20" fill="#fdecea" stroke="#c0392b" stroke-width="2"/><text x="760" y="499" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#c0392b" text-anchor="middle">REBUILD</text><rect x="962" y="474" width="156" height="40" rx="20" fill="#fdecea" stroke="#c0392b" stroke-width="2"/><text x="1040" y="499" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#c0392b" text-anchor="middle">REBUILD</text><line x1="96" y1="526" x2="96" y2="538" stroke="#9aa1ab" stroke-width="2" marker-end="url(#arr)"/><rect x="72" y="538" width="500" height="60" rx="8" fill="#fbfbfd" stroke="#9aa1ab" stroke-width="2"/><text x="88" y="564" font-family="Menlo, Consolas, monospace" font-size="15" font-weight="bold" fill="#1f2430" text-anchor="start">CMD [python, -m, app.serve]</text><text x="88" y="585" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#5a6270" text-anchor="start">metadata, instant</text><rect x="682" y="546" width="156" height="40" rx="20" fill="#fdecea" stroke="#c0392b" stroke-width="2"/><text x="760" y="571" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#c0392b" text-anchor="middle">REBUILD</text><rect x="962" y="546" width="156" height="40" rx="20" fill="#fdecea" stroke="#c0392b" stroke-width="2"/><text x="1040" y="571" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#c0392b" text-anchor="middle">REBUILD</text><text x="72" y="630" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1f2430" text-anchor="start">Scenario A pays only for the code copy: about 12 seconds. Scenario B re-runs pip install: about 3.5 minutes.</text><text x="72" y="654" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#5a6270" text-anchor="start">This is why requirements.txt is copied before app code, and why .dockerignore keeps the context small.</text></svg>