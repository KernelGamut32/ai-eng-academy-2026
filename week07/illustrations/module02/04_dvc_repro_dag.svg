<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa0ab"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="#212226"/>
  <text x="60" y="70" font-size="40" font-weight="700" fill="#e8e8ea">dvc repro: A Makefile for ML</text>
  <text x="60" y="108" font-size="22" fill="#a3a7b0">dvc.lock records the hash of every dep and out. repro re-runs a stage only when a dep hash changed.</text>

  <!-- legend -->
  <g transform="translate(1120 50)" font-size="16">
    <rect x="0" y="0" width="22" height="22" rx="5" fill="#253a2c" stroke="#5fcf80" stroke-width="3"/>
    <text x="32" y="17" fill="#c8cbd2">re-runs</text>
    <rect x="130" y="0" width="22" height="22" rx="5" fill="#2c2e33" stroke="#4a4d55" stroke-width="2"/>
    <text x="162" y="17" fill="#c8cbd2">skipped (cached)</text>
    <rect x="330" y="0" width="22" height="22" rx="5" fill="#3a2c2c" stroke="#f06a6a" stroke-width="3"/>
    <text x="362" y="17" fill="#c8cbd2">the edit</text>
  </g>

  <!-- Scenario A -->
  <g transform="translate(60 150)">
    <rect x="0" y="0" width="720" height="560" rx="14" fill="#2c2e33" stroke="#4a4d55" stroke-width="2"/>
    <text x="24" y="40" font-size="22" font-weight="700" fill="#e8e8ea">Scenario A: you bump the learning rate</text>
    <text x="24" y="68" font-size="16" fill="#a3a7b0">Edit configs/train_config.yaml, then run dvc repro</text>

    <!-- deps column -->
    <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15">
      <rect x="24" y="100" width="230" height="46" rx="8" fill="#2c2e33" stroke="#4a4d55" stroke-width="2"/>
      <text x="36" y="128" fill="#c8cbd2">data/raw_reviews.jsonl</text>
      <rect x="24" y="156" width="230" height="46" rx="8" fill="#2c2e33" stroke="#4a4d55" stroke-width="2"/>
      <text x="36" y="184" fill="#c8cbd2">src/preprocess.py</text>

      <rect x="24" y="300" width="230" height="46" rx="8" fill="#2c2e33" stroke="#4a4d55" stroke-width="2"/>
      <text x="36" y="328" fill="#c8cbd2">src/train.py</text>
      <rect x="24" y="356" width="230" height="46" rx="8" fill="#3a2c2c" stroke="#f06a6a" stroke-width="3"/>
      <text x="36" y="384" fill="#ffb3b3">configs/train_config.yaml</text>
    </g>

    <!-- stages -->
    <rect x="310" y="118" width="170" height="70" rx="10" fill="#2c2e33" stroke="#4a4d55" stroke-width="2"/>
    <text x="395" y="148" font-size="20" font-weight="700" fill="#a3a7b0" text-anchor="middle">preprocess</text>
    <text x="395" y="172" font-size="14" fill="#6c707a" text-anchor="middle">unchanged: skip</text>

    <rect x="310" y="318" width="170" height="70" rx="10" fill="#253a2c" stroke="#5fcf80" stroke-width="3"/>
    <text x="395" y="348" font-size="20" font-weight="700" fill="#e8e8ea" text-anchor="middle">train</text>
    <text x="395" y="372" font-size="14" fill="#5fcf80" text-anchor="middle">dep changed: run</text>

    <!-- outs -->
    <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15">
      <rect x="530" y="130" width="170" height="46" rx="8" fill="#2c2e33" stroke="#4a4d55" stroke-width="2"/>
      <text x="542" y="158" fill="#c8cbd2">processed.parquet</text>
      <rect x="530" y="300" width="170" height="46" rx="8" fill="#253a2c" stroke="#5fcf80" stroke-width="2"/>
      <text x="542" y="328" fill="#c8cbd2">finetune.safetensors</text>
      <rect x="530" y="356" width="170" height="46" rx="8" fill="#253a2c" stroke="#5fcf80" stroke-width="2"/>
      <text x="542" y="384" fill="#c8cbd2">eval_results.json</text>
    </g>

    <!-- arrows -->
    <g stroke="#9aa0ab" stroke-width="3" fill="none" marker-end="url(#a)">
      <line x1="254" y1="123" x2="300" y2="140"/>
      <line x1="254" y1="179" x2="300" y2="165"/>
      <line x1="480" y1="153" x2="520" y2="153"/>
      <line x1="254" y1="323" x2="300" y2="340"/>
      <line x1="254" y1="379" x2="300" y2="365"/>
      <line x1="480" y1="343" x2="520" y2="325"/>
      <line x1="480" y1="363" x2="520" y2="378"/>
      <!-- processed.parquet feeds train -->
      <path d="M 615 176 L 615 240 L 290 240 L 290 318" stroke-dasharray="6 6"/>
    </g>
    <text x="450" y="232" font-size="13" fill="#6c707a" text-anchor="middle">out of preprocess is a dep of train</text>

    <rect x="24" y="440" width="672" height="96" rx="10" fill="#1a1b1e" stroke="#4a4d55" stroke-width="2"/>
    <text x="40" y="470" font-size="16" font-weight="700" fill="#e8e8ea">Terminal</text>
    <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15" fill="#c8cbd2">
      <text x="40" y="496">$ dvc repro</text>
      <text x="40" y="518">Stage 'preprocess' didn't change, skipping</text>
    </g>
    <text x="420" y="518" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15" fill="#5fcf80">Running stage 'train': ...</text>
  </g>

  <!-- Scenario B -->
  <g transform="translate(820 150)">
    <rect x="0" y="0" width="720" height="560" rx="14" fill="#2c2e33" stroke="#4a4d55" stroke-width="2"/>
    <text x="24" y="40" font-size="22" font-weight="700" fill="#e8e8ea">Scenario B: new reviews land</text>
    <text x="24" y="68" font-size="16" fill="#a3a7b0">Replace data/raw_reviews.jsonl with v1.2, then run dvc repro</text>

    <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15">
      <rect x="24" y="100" width="230" height="46" rx="8" fill="#3a2c2c" stroke="#f06a6a" stroke-width="3"/>
      <text x="36" y="128" fill="#ffb3b3">data/raw_reviews.jsonl</text>
      <rect x="24" y="156" width="230" height="46" rx="8" fill="#2c2e33" stroke="#4a4d55" stroke-width="2"/>
      <text x="36" y="184" fill="#c8cbd2">src/preprocess.py</text>

      <rect x="24" y="300" width="230" height="46" rx="8" fill="#2c2e33" stroke="#4a4d55" stroke-width="2"/>
      <text x="36" y="328" fill="#c8cbd2">src/train.py</text>
      <rect x="24" y="356" width="230" height="46" rx="8" fill="#2c2e33" stroke="#4a4d55" stroke-width="2"/>
      <text x="36" y="384" fill="#c8cbd2">configs/train_config.yaml</text>
    </g>

    <rect x="310" y="118" width="170" height="70" rx="10" fill="#253a2c" stroke="#5fcf80" stroke-width="3"/>
    <text x="395" y="148" font-size="20" font-weight="700" fill="#e8e8ea" text-anchor="middle">preprocess</text>
    <text x="395" y="172" font-size="14" fill="#5fcf80" text-anchor="middle">dep changed: run</text>

    <rect x="310" y="318" width="170" height="70" rx="10" fill="#253a2c" stroke="#5fcf80" stroke-width="3"/>
    <text x="395" y="348" font-size="20" font-weight="700" fill="#e8e8ea" text-anchor="middle">train</text>
    <text x="395" y="372" font-size="14" fill="#5fcf80" text-anchor="middle">input changed: run</text>

    <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15">
      <rect x="530" y="130" width="170" height="46" rx="8" fill="#253a2c" stroke="#5fcf80" stroke-width="2"/>
      <text x="542" y="158" fill="#c8cbd2">processed.parquet</text>
      <rect x="530" y="300" width="170" height="46" rx="8" fill="#253a2c" stroke="#5fcf80" stroke-width="2"/>
      <text x="542" y="328" fill="#c8cbd2">finetune.safetensors</text>
      <rect x="530" y="356" width="170" height="46" rx="8" fill="#253a2c" stroke="#5fcf80" stroke-width="2"/>
      <text x="542" y="384" fill="#c8cbd2">eval_results.json</text>
    </g>

    <g stroke="#9aa0ab" stroke-width="3" fill="none" marker-end="url(#a)">
      <line x1="254" y1="123" x2="300" y2="140"/>
      <line x1="254" y1="179" x2="300" y2="165"/>
      <line x1="480" y1="153" x2="520" y2="153"/>
      <line x1="254" y1="323" x2="300" y2="340"/>
      <line x1="254" y1="379" x2="300" y2="365"/>
      <line x1="480" y1="343" x2="520" y2="325"/>
      <line x1="480" y1="363" x2="520" y2="378"/>
      <path d="M 615 176 L 615 240 L 290 240 L 290 318" stroke="#5fcf80" stroke-dasharray="6 6"/>
    </g>
    <text x="450" y="232" font-size="13" fill="#5fcf80" text-anchor="middle">change propagates downstream</text>

    <rect x="24" y="440" width="672" height="96" rx="10" fill="#1a1b1e" stroke="#4a4d55" stroke-width="2"/>
    <text x="40" y="470" font-size="16" font-weight="700" fill="#e8e8ea">Terminal</text>
    <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15">
      <text x="40" y="496" fill="#c8cbd2">$ dvc repro</text>
      <text x="40" y="518" fill="#5fcf80">Running stage 'preprocess': ...   Running stage 'train': ...</text>
    </g>
  </g>

  <!-- bottom -->
  <rect x="60" y="740" width="1480" height="100" rx="12" fill="#1a1b1e" stroke="#4a4d55" stroke-width="2"/>
  <text x="84" y="776" font-size="20" font-weight="700" fill="#e8e8ea">Same idea as make, same idea as a Docker layer cache: hash the inputs, skip the work if nothing upstream moved.</text>
  <text x="84" y="812" font-size="18" fill="#a3a7b0">Airflow (next module) schedules and distributes this same DAG. dvc repro is the single-machine, commit-it-to-Git version you can run today.</text>
</svg>
