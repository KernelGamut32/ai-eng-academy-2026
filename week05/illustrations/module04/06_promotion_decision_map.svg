<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#15803d"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1280" height="720" fill="#ffffff"/>

  <text x="640" y="42" text-anchor="middle" font-size="30" font-weight="bold" fill="#1e3a5f">Which Run Ships? The Highest Number Is Not the Answer</text>
  <text x="640" y="70" text-anchor="middle" font-size="16" fill="#475569">Discussion 2's six runs, plotted. Every trap from the module appears as a marker style. Evidence quality decides, not position.</text>

  <!-- Plot frame -->
  <rect x="160" y="120" width="1020" height="440" fill="#f8fafc" stroke="#1e3a5f" stroke-width="2"/>
  <text x="670" y="600" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e3a5f">Answer relevancy →</text>
  <g font-size="12" fill="#64748b" text-anchor="middle">
    <text x="160" y="580">0.35</text><text x="1180" y="580">1.00</text>
  </g>
  <text x="110" y="340" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e3a5f" transform="rotate(-90 110 340)">Faithfulness →</text>
  <g font-size="12" fill="#64748b">
    <text x="126" y="132">1.00</text><text x="126" y="560">0.75</text>
  </g>

  <!-- run-A: metric-gamed corner -->
  <circle cx="254" cy="226" r="14" fill="#d97706" stroke="#ffffff" stroke-width="2.5"/>
  <text x="254" y="232" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">A</text>
  <text x="280" y="212" font-size="13" font-weight="bold" fill="#b45309">run-A · 0.94 / 0.41 · abstains constantly</text>
  <text x="280" y="232" font-size="12.5" fill="#334155">Faithfulness bought by refusing to answer. Never fabricates</text>
  <text x="280" y="250" font-size="12.5" fill="#334155">because it barely answers. One metric alone is gameable.</text>

  <!-- run-B: incomparable, dashed -->
  <circle cx="976" cy="278" r="14" fill="#ffffff" stroke="#b91c1c" stroke-width="3" stroke-dasharray="5 4"/>
  <text x="976" y="284" text-anchor="middle" font-size="14" font-weight="bold" fill="#b91c1c">B</text>
  <text x="1000" y="266" font-size="13" font-weight="bold" fill="#b91c1c">run-B · 0.91 / 0.87</text>
  <text x="1000" y="284" font-size="12.5" fill="#334155">different eval set version:</text>
  <text x="1000" y="302" font-size="12.5" fill="#334155">not on this chart's scale at all</text>

  <!-- run-C: confounded, dashed -->
  <circle cx="913" cy="331" r="14" fill="#ffffff" stroke="#b91c1c" stroke-width="3" stroke-dasharray="5 4"/>
  <text x="913" y="337" text-anchor="middle" font-size="14" font-weight="bold" fill="#b91c1c">C</text>
  <text x="889" y="318" text-anchor="end" font-size="13" font-weight="bold" fill="#b91c1c">run-C · 0.88 / 0.83</text>
  <text x="889" y="336" text-anchor="end" font-size="12.5" fill="#334155">rank, LR, chunk all changed:</text>
  <text x="889" y="354" text-anchor="end" font-size="12.5" fill="#334155">good number, zero attribution</text>

  <!-- run-D: dirty git -->
  <circle cx="929" cy="404" r="14" fill="#64748b" stroke="#ffffff" stroke-width="2.5"/>
  <text x="929" y="410" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">D</text>
  <text x="953" y="398" font-size="13" font-weight="bold" fill="#475569">run-D · 0.85 / 0.84 · dirty git state</text>
  <text x="953" y="416" font-size="12.5" fill="#334155">the code that ran is not the code git says ran:</text>
  <text x="953" y="434" font-size="12.5" fill="#334155">reproducibility unverifiable until rerun clean</text>

  <!-- run-F: baseline -->
  <circle cx="850" cy="437" r="14" fill="#1e3a5f" stroke="#ffffff" stroke-width="2.5"/>
  <text x="850" y="443" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">F</text>
  <text x="826" y="430" text-anchor="end" font-size="13" font-weight="bold" fill="#1e3a5f">run-F · 0.82 / 0.79 · baseline</text>
  <text x="826" y="448" text-anchor="end" font-size="12.5" fill="#334155">the anchor every claim compares against</text>

  <!-- run-E: the defensible one -->
  <circle cx="960" cy="349" r="17" fill="#15803d" stroke="#ffffff" stroke-width="3"/>
  <text x="960" y="356" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">E</text>
  <line x1="862" y1="428" x2="946" y2="360" stroke="#15803d" stroke-width="3" marker-end="url(#ar6)"/>
  <text x="962" y="378" font-size="13" font-weight="bold" fill="#15803d">run-E · 0.87 / 0.86</text>
  <text x="962" y="396" font-size="12.5" fill="#15803d">only top_k changed from baseline F</text>

  <!-- Verdict panel -->
  <rect x="180" y="470" width="560" height="80" rx="12" fill="#ecfdf5" stroke="#15803d" stroke-width="2"/>
  <text x="200" y="498" font-size="14.5" font-weight="bold" fill="#15803d">Promote E. It is not the best number; it is the best EVIDENCE.</text>
  <text x="200" y="520" font-size="13" fill="#334155">One variable from the baseline, same eval set, clean tree. The gain</text>
  <text x="200" y="538" font-size="13" fill="#334155">+0.05 faithfulness, +0.07 relevancy is attributable and repeatable.</text>

  <!-- Legend / trap key -->
  <rect x="60" y="620" width="1160" height="76" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="80" y="648" font-size="14" font-weight="bold" fill="#1e3a5f">How to read the markers (each is a module trap):</text>
  <text x="80" y="670" font-size="13" fill="#334155">dashed outline = number untrustworthy for this decision (B: incomparable eval set; C: confounded) · amber = metric gamed (A)</text>
  <text x="80" y="690" font-size="13" fill="#334155">gray = provenance suspect (D: dirty tree) · green = attributable single-variable evidence (E), promoted over higher raw numbers</text>
</svg>
