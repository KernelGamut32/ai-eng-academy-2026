<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#ffffff"/>

  <text x="640" y="46" text-anchor="middle" font-size="30" font-weight="bold" fill="#1e3a5f">The Reproducibility Gap: The Claim vs the Record</text>
  <text x="640" y="76" text-anchor="middle" font-size="17" fill="#475569">"The r=32 adapter scored 0.91 on faithfulness." Everything red is what that sentence does not tell you.</text>

  <!-- Left: the claim -->
  <rect x="40" y="110" width="380" height="540" rx="14" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="230" y="146" text-anchor="middle" font-size="18" font-weight="bold" fill="#b91c1c">WHAT YOU WERE TOLD</text>

  <rect x="70" y="170" width="320" height="110" rx="10" fill="#ffffff" stroke="#fca5a5"/>
  <text x="90" y="202" font-size="15" fill="#334155" font-style="italic">"The r=32 adapter scored</text>
  <text x="90" y="226" font-size="15" fill="#334155" font-style="italic">0.91 on faithfulness. Much</text>
  <text x="90" y="250" font-size="15" fill="#334155" font-style="italic">better than baseline. Ship it."</text>

  <text x="90" y="322" font-size="14" font-weight="bold" fill="#b91c1c">Questions you cannot answer:</text>
  <g font-size="14" fill="#7f1d1d">
    <text x="90" y="352">Which base model?</text>
    <text x="90" y="380">Which training data version?</text>
    <text x="90" y="408">Learning rate? Epochs?</text>
    <text x="90" y="436">Which eval set, which version?</text>
    <text x="90" y="464">Which index config? top_k?</text>
    <text x="90" y="492">Baseline measured on what?</text>
    <text x="90" y="520">Which of the four adapter</text>
    <text x="90" y="544">directories is even r=32?</text>
  </g>
  <text x="90" y="596" font-size="13" fill="#64748b">0.91 with no record is not a result.</text>
  <text x="90" y="616" font-size="13" fill="#64748b">It is an anecdote with decimals.</text>

  <!-- Right: the record -->
  <rect x="460" y="110" width="780" height="540" rx="14" fill="#ecfdf5" stroke="#15803d" stroke-width="2"/>
  <text x="850" y="146" text-anchor="middle" font-size="18" font-weight="bold" fill="#15803d">WHAT A TRACKED RUN HOLDS</text>

  <!-- config card -->
  <rect x="490" y="170" width="340" height="240" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="510" y="198" font-size="14" font-weight="bold" fill="#7c3aed">config (complete)</text>
  <g font-size="12.5" font-family="monospace" fill="#334155">
    <text x="510" y="224">base_model: SmolLM2-360M</text>
    <text x="510" y="244">adapter: cordwell:v4 (r=32)</text>
    <text x="510" y="264">learning_rate: 2e-4, epochs: 3</text>
    <text x="510" y="284">train_data: catalog-sft:v5</text>
    <text x="510" y="304">eval_set:  cordwell-eval:v2</text>
    <text x="510" y="324">index_config: index-config:v3</text>
    <text x="510" y="344">top_k: 5, temperature: 0.1</text>
  </g>
  <text x="510" y="380" font-size="12" fill="#64748b">Every knob that would change the number,</text>
  <text x="510" y="397" font-size="12" fill="#64748b">named and versioned at init time.</text>

  <!-- environment card -->
  <rect x="860" y="170" width="350" height="240" rx="10" fill="#ffffff" stroke="#1e3a5f" stroke-width="1.5"/>
  <text x="880" y="198" font-size="14" font-weight="bold" fill="#1e3a5f">environment (automatic)</text>
  <g font-size="12.5" fill="#334155">
    <text x="880" y="226">git commit a41f9c2, tree CLEAN</text>
    <text x="880" y="250">Python 3.13, package versions pinned</text>
    <text x="880" y="274">launch command recorded</text>
    <text x="880" y="298">run ID + timestamp: which of the four</text>
    <text x="880" y="318">directories produced 0.91 is no longer</text>
    <text x="880" y="338">a mystery, it is a lineage edge</text>
  </g>
  <text x="880" y="380" font-size="12" fill="#64748b">Captured without asking. A dirty tree here</text>
  <text x="880" y="397" font-size="12" fill="#64748b">means the code is not what git says it is.</text>

  <!-- metrics + artifacts strip -->
  <rect x="490" y="430" width="340" height="120" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="510" y="458" font-size="14" font-weight="bold" fill="#2563eb">metrics (with history)</text>
  <g font-size="12.5" font-family="monospace" fill="#334155">
    <text x="510" y="484">generation/faithfulness: 0.91</text>
    <text x="510" y="504">retrieval/context_recall: 0.88</text>
    <text x="510" y="524">vs baseline run-id 7f3a: 0.82</text>
  </g>

  <rect x="860" y="430" width="350" height="120" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
  <text x="880" y="458" font-size="14" font-weight="bold" fill="#b45309">artifacts (lineage)</text>
  <g font-size="12.5" font-family="monospace" fill="#334155">
    <text x="880" y="484">used:   cordwell-eval:v2</text>
    <text x="880" y="504">used:   index-config:v3</text>
    <text x="880" y="524">logged: cordwell-adapter:v4</text>
  </g>

  <text x="850" y="586" text-anchor="middle" font-size="14" font-weight="bold" fill="#15803d">"Ship it" becomes checkable: rerun this run ID's config and you either get 0.91 or a specific question.</text>
  <text x="850" y="612" text-anchor="middle" font-size="13" fill="#334155">The gap between the two panels costs about three lines of code, paid before the run.</text>

  <text x="640" y="690" text-anchor="middle" font-size="15" fill="#475569">Left panel is Discussion 1's starting position. Right panel is what makes Formative Check 1's three missing keys visible by absence.</text>
</svg>
