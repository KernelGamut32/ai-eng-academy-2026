<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1280" height="720" fill="#ffffff"/>

  <text x="640" y="44" text-anchor="middle" font-size="30" font-weight="bold" fill="#1e3a5f">One Dial, Three Different "Best" Answers</text>
  <text x="640" y="72" text-anchor="middle" font-size="16" fill="#475569">The verified Cordwell sweep on one axis. Which threshold is right depends entirely on which question you asked. 0.5 answered none of them.</text>

  <!-- Threshold axis 0..1 -> x 90..1190 -->
  <line x1="90" y1="380" x2="1190" y2="380" stroke="#1e3a5f" stroke-width="4"/>
  <g stroke="#94a3b8" stroke-width="1.5">
    <line x1="90" y1="370" x2="90" y2="390"/><line x1="310" y1="370" x2="310" y2="390"/>
    <line x1="530" y1="370" x2="530" y2="390"/><line x1="750" y1="370" x2="750" y2="390"/>
    <line x1="970" y1="370" x2="970" y2="390"/><line x1="1190" y1="370" x2="1190" y2="390"/>
  </g>
  <g font-size="13" fill="#64748b" text-anchor="middle">
    <text x="90" y="412">0.0</text><text x="310" y="412">0.2</text><text x="530" y="412">0.4</text>
    <text x="750" y="412">0.6</text><text x="970" y="412">0.8</text><text x="1190" y="412">1.0</text>
  </g>
  <text x="640" y="440" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e3a5f">decision threshold →</text>
  <text x="150" y="356" font-size="12.5" fill="#64748b">← flag more (recall up, queue up)</text>
  <text x="1130" y="356" text-anchor="end" font-size="12.5" fill="#64748b">flag less (precision up, misses up) →</text>

  <!-- Sweep point cards above axis: 0.30 @420, 0.40 @530 -->
  <g>
    <circle cx="420" cy="380" r="8" fill="#475569"/>
    <line x1="420" y1="372" x2="420" y2="300" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 4"/>
    <rect x="330" y="200" width="180" height="100" rx="10" fill="#f8fafc" stroke="#64748b"/>
    <text x="420" y="226" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e3a5f">0.30</text>
    <text x="420" y="248" text-anchor="middle" font-size="12.5" font-family="monospace" fill="#334155">P .104 · R .985</text>
    <text x="420" y="268" text-anchor="middle" font-size="12.5" fill="#334155">queue 318 / 1,000</text>
    <text x="420" y="288" text-anchor="middle" font-size="12" fill="#b45309">catches nearly all, buries the team</text>
  </g>
  <g>
    <circle cx="530" cy="380" r="8" fill="#475569"/>
    <line x1="530" y1="372" x2="530" y2="170" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 4"/>
    <rect x="450" y="96" width="160" height="74" rx="10" fill="#f8fafc" stroke="#64748b"/>
    <text x="530" y="120" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e3a5f">0.40</text>
    <text x="530" y="140" text-anchor="middle" font-size="12.5" font-family="monospace" fill="#334155">P .175 · R .940</text>
    <text x="530" y="160" text-anchor="middle" font-size="12.5" fill="#334155">queue 180 / 1,000</text>
  </g>

  <!-- 0.50 default @640 -->
  <g>
    <circle cx="640" cy="380" r="10" fill="#7c3aed"/>
    <line x1="640" y1="370" x2="640" y2="300" stroke="#7c3aed" stroke-width="2" stroke-dasharray="4 4"/>
    <rect x="558" y="186" width="220" height="114" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <text x="668" y="212" text-anchor="middle" font-size="14" font-weight="bold" fill="#7c3aed">0.50 · the predict() default</text>
    <text x="668" y="234" text-anchor="middle" font-size="12.5" font-family="monospace" fill="#334155">P .331 · R .791 · F1 .467</text>
    <text x="668" y="254" text-anchor="middle" font-size="12.5" fill="#334155">queue 80 / 1,000</text>
    <text x="668" y="278" text-anchor="middle" font-size="12" fill="#7c3aed" font-weight="bold">not neutral: an unexamined assumption</text>
  </g>

  <!-- F1-optimal @750 -->
  <g>
    <circle cx="750" cy="380" r="10" fill="#2563eb"/>
    <line x1="750" y1="370" x2="750" y2="120" stroke="#2563eb" stroke-width="2" stroke-dasharray="4 4"/>
    <rect x="700" y="96" width="300" height="88" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="850" y="122" text-anchor="middle" font-size="14" font-weight="bold" fill="#2563eb">ANSWER 1 · statistics: 0.60</text>
    <text x="850" y="144" text-anchor="middle" font-size="12.5" font-family="monospace" fill="#334155">argmax F1 -> 0.601, F1 = 0.5821</text>
    <text x="850" y="166" text-anchor="middle" font-size="12" fill="#334155">best balance IF errors cost the same. They do not.</text>
  </g>

  <!-- Cost degenerate arrow -->
  <g>
    <line x1="420" y1="480" x2="130" y2="480" stroke="#b91c1c" stroke-width="3" marker-end="url(#arw)"/>
    <rect x="440" y="452" width="430" height="60" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
    <text x="655" y="477" text-anchor="middle" font-size="14" font-weight="bold" fill="#b91c1c">ANSWER 2 · raw cost model ($250 FN vs $4 FP): slide toward 0</text>
    <text x="655" y="499" text-anchor="middle" font-size="12.5" fill="#7f1d1d">unconstrained, "flag everything" is genuinely cost-optimal: a degenerate policy nobody can staff</text>
  </g>

  <!-- Capacity answer @0.49 -> 629 -->
  <g>
    <circle cx="629" cy="380" r="10" fill="#15803d"/>
    <line x1="629" y1="390" x2="560" y2="545" stroke="#15803d" stroke-width="2" stroke-dasharray="4 4"/>
    <rect x="300" y="548" width="520" height="88" rx="10" fill="#ecfdf5" stroke="#15803d" stroke-width="2"/>
    <text x="560" y="574" text-anchor="middle" font-size="14" font-weight="bold" fill="#15803d">ANSWER 3 · cost under a capacity constraint: 0.49</text>
    <text x="560" y="596" text-anchor="middle" font-size="12.5" fill="#334155">cheapest threshold keeping the flag rate at or under 10%: the best point you can actually staff</text>
    <text x="560" y="618" text-anchor="middle" font-size="12" fill="#15803d" font-weight="bold">same shape as an SLO conversation: an optimum subject to what operations can absorb</text>
  </g>

  <!-- Punchline -->
  <rect x="150" y="662" width="980" height="46" rx="10" fill="#1e3a5f"/>
  <text x="640" y="691" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">Three legitimate objectives, three different thresholds. Choosing one is a business decision, so write the objective down first.</text>
</svg>
