<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#ffffff"/>

  <text x="640" y="44" text-anchor="middle" font-size="30" font-weight="bold" fill="#1e3a5f">Precision Is a Column. Recall Is a Row.</text>
  <text x="640" y="72" text-anchor="middle" font-size="16" fill="#475569">The Cordwell matrix at threshold 0.50. Every metric of the day is a ratio of these four cells; the geometry tells you which cells.</text>

  <!-- Matrix frame -->
  <text x="410" y="118" text-anchor="middle" font-size="15" font-weight="bold" fill="#2563eb">Predicted: Escalate</text>
  <text x="660" y="118" text-anchor="middle" font-size="15" font-weight="bold" fill="#64748b">Predicted: Routine</text>
  <text x="255" y="205" text-anchor="end" font-size="15" font-weight="bold" fill="#d97706">Actual: Safety issue</text>
  <text x="255" y="365" text-anchor="end" font-size="15" font-weight="bold" fill="#64748b">Actual: Routine</text>

  <!-- Cells -->
  <rect x="285" y="140" width="250" height="130" rx="10" fill="#ecfdf5" stroke="#15803d" stroke-width="2"/>
  <text x="410" y="176" text-anchor="middle" font-size="17" font-weight="bold" fill="#15803d">TP = 53</text>
  <text x="410" y="200" text-anchor="middle" font-size="12.5" fill="#334155">Safety issue flagged correctly.</text>
  <text x="410" y="218" text-anchor="middle" font-size="12.5" fill="#334155">The system worked.</text>
  <rect x="300" y="234" width="212" height="14" rx="4" fill="#e2e8f0"/>
  <rect x="300" y="234" width="6" height="14" rx="3" fill="#15803d"/>

  <rect x="545" y="140" width="250" height="130" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="3"/>
  <text x="670" y="176" text-anchor="middle" font-size="17" font-weight="bold" fill="#b91c1c">FN = 14</text>
  <text x="670" y="200" text-anchor="middle" font-size="12.5" fill="#334155">Safety report sits unread.</text>
  <text x="670" y="218" text-anchor="middle" font-size="12.5" fill="#b91c1c" font-weight="bold">The costly error (Type II).</text>
  <rect x="560" y="234" width="212" height="14" rx="4" fill="#e2e8f0"/>
  <rect x="560" y="234" width="2" height="14" rx="1" fill="#b91c1c"/>

  <rect x="285" y="300" width="250" height="130" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="410" y="336" text-anchor="middle" font-size="17" font-weight="bold" fill="#b45309">FP = 107</text>
  <text x="410" y="360" text-anchor="middle" font-size="12.5" fill="#334155">Routine review flagged (Type I).</text>
  <text x="410" y="378" text-anchor="middle" font-size="12.5" fill="#334155">A human's time, wasted.</text>
  <rect x="300" y="394" width="212" height="14" rx="4" fill="#e2e8f0"/>
  <rect x="300" y="394" width="12" height="14" rx="4" fill="#d97706"/>

  <rect x="545" y="300" width="250" height="130" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="670" y="336" text-anchor="middle" font-size="17" font-weight="bold" fill="#475569">TN = 1,826</text>
  <text x="670" y="360" text-anchor="middle" font-size="12.5" fill="#334155">Routine, left alone. Correct,</text>
  <text x="670" y="378" text-anchor="middle" font-size="12.5" fill="#334155">plentiful, and uninteresting.</text>
  <rect x="560" y="394" width="212" height="14" rx="4" fill="#e2e8f0"/>
  <rect x="560" y="394" width="212" height="14" rx="4" fill="#64748b"/>

  <text x="540" y="460" text-anchor="middle" font-size="12" fill="#64748b">gray bars: each cell's share of all 2,000 reviews, to scale. TN dwarfs everything: that is the imbalance.</text>

  <!-- Precision column bracket -->
  <path d="M 285 490 L 285 505 L 535 505 L 535 490" fill="none" stroke="#2563eb" stroke-width="3"/>
  <text x="410" y="532" text-anchor="middle" font-size="15" font-weight="bold" fill="#2563eb">PRECISION lives in this column</text>
  <text x="410" y="556" text-anchor="middle" font-size="14" font-family="monospace" fill="#2563eb">TP / (TP + FP) = 53 / 160 = 0.331</text>
  <text x="410" y="578" text-anchor="middle" font-size="12.5" fill="#334155">Of everything we escalate, how much deserved it?</text>

  <!-- Recall row bracket -->
  <path d="M 810 140 L 825 140 L 825 270 L 810 270" fill="none" stroke="#d97706" stroke-width="3"/>
  <text x="845" y="185" font-size="15" font-weight="bold" fill="#b45309">RECALL lives in this row</text>
  <text x="845" y="209" font-size="14" font-family="monospace" fill="#b45309">TP / (TP + FN) = 53 / 67 = 0.791</text>
  <text x="845" y="231" font-size="12.5" fill="#334155">Of every real safety issue, how many did we catch?</text>
  <text x="845" y="253" font-size="12.5" fill="#334155">The 14 in red are the ones we did not.</text>

  <!-- Derived metrics panel -->
  <rect x="845" y="300" width="395" height="290" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="865" y="330" font-size="15" font-weight="bold" fill="#1e3a5f">Everything else is derived from the four cells</text>
  <g font-size="13.5" fill="#334155">
    <text x="865" y="362"><tspan font-weight="bold">Accuracy</tspan> = diagonal over everything</text>
    <text x="865" y="382" font-family="monospace">(53 + 1826) / 2000 = 0.9395</text>
    <text x="865" y="410"><tspan font-weight="bold">F1</tspan> = harmonic mean of the two brackets</text>
    <text x="865" y="430" font-family="monospace">2PR / (P + R) = 0.467</text>
    <text x="865" y="458"><tspan font-weight="bold">MCC</tspan> = all four cells, one correlation</text>
    <text x="865" y="478" font-family="monospace">0.488  (constant predictor scores 0)</text>
    <text x="865" y="506"><tspan font-weight="bold">ravel() order</tspan> = tn, fp, fn, tp</text>
    <text x="865" y="526" fill="#b91c1c">Get it backwards and precision and recall</text>
    <text x="865" y="544" fill="#b91c1c">silently swap. Memorize the order.</text>
  </g>

  <text x="640" y="640" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e3a5f">The column asks about YOUR flags. The row asks about THE WORLD's positives.</text>
  <text x="640" y="668" text-anchor="middle" font-size="14" fill="#475569">Which question matters more is the whole precision-first vs recall-first debate: for Cordwell safety, the row wins.</text>
</svg>
