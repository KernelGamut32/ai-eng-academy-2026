<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#ffffff"/>

  <text x="640" y="42" text-anchor="middle" font-size="29" font-weight="bold" fill="#1e3a5f">BLEU's Two Moving Parts, Drawn</text>
  <text x="640" y="70" text-anchor="middle" font-size="16" fill="#475569">Clipping stops repetition from gaming precision. The brevity penalty punishes short output harder than intuition expects.</text>

  <!-- Left: clipping -->
  <rect x="40" y="95" width="580" height="560" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="330" y="130" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e3a5f">Part 1 · Clipped n-gram precision</text>

  <rect x="70" y="150" width="520" height="70" rx="10" fill="#ffffff" stroke="#94a3b8"/>
  <text x="90" y="176" font-size="13" font-family="monospace" fill="#334155">ref:  "the drill sat on the shelf"</text>
  <text x="90" y="200" font-size="13" font-family="monospace" fill="#334155">cand: "the drill the drill on the shelf"</text>

  <text x="90" y="252" font-size="14" font-weight="bold" fill="#1e3a5f">Count the candidate's unigrams against the reference:</text>
  <g font-size="13.5" font-family="monospace">
    <text x="90" y="284" fill="#334155">token   in cand   in ref   credited</text>
    <text x="90" y="312" fill="#334155">"the"     3      2     <tspan fill="#b91c1c" font-weight="bold">2  (clipped)</tspan></text>
    <text x="90" y="340" fill="#334155">"drill"    2      1     <tspan fill="#b91c1c" font-weight="bold">1  (clipped)</tspan></text>
    <text x="90" y="368" fill="#334155">"on"      1      1     1</text>
    <text x="90" y="396" fill="#334155">"shelf"    1      1     1</text>
  </g>

  <g font-size="14.5">
    <rect x="70" y="430" width="245" height="86" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
    <text x="192" y="460" text-anchor="middle" font-weight="bold" fill="#b91c1c">Without clipping</text>
    <text x="192" y="488" text-anchor="middle" font-family="monospace" fill="#334155">7 / 7 = 1.000</text>
    <text x="192" y="508" text-anchor="middle" font-size="11.5" fill="#7f1d1d">babble "the drill" forever, score perfectly</text>

    <rect x="345" y="430" width="245" height="86" rx="10" fill="#ecfdf5" stroke="#15803d" stroke-width="2"/>
    <text x="467" y="460" text-anchor="middle" font-weight="bold" fill="#15803d">With clipping</text>
    <text x="467" y="488" text-anchor="middle" font-family="monospace" fill="#334155">5 / 7 = 0.714</text>
    <text x="467" y="508" text-anchor="middle" font-size="11.5" fill="#166534">each token capped at its reference count</text>
  </g>
  <text x="330" y="556" text-anchor="middle" font-size="13" fill="#334155">Clipping is why repetition cannot inflate precision. It is BLEU's</text>
  <text x="330" y="576" text-anchor="middle" font-size="13" fill="#334155">defense against the cheapest possible gaming strategy, and it is</text>
  <text x="330" y="596" text-anchor="middle" font-size="13" fill="#334155">computed per n-gram order before the geometric mean.</text>

  <!-- Right: BP curve -->
  <rect x="660" y="95" width="580" height="560" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="950" y="130" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e3a5f">Part 2 · The brevity penalty, to scale</text>
  <text x="950" y="154" text-anchor="middle" font-size="13" font-family="monospace" fill="#475569">BP = 1 if c >= r else exp(1 - r/c)</text>

  <!-- plot frame: x 720..1200 for ratio .3..1.0, y 180..460 for BP 1..0 -->
  <line x1="720" y1="460" x2="1200" y2="460" stroke="#1e3a5f" stroke-width="2"/>
  <line x1="720" y1="180" x2="720" y2="460" stroke="#1e3a5f" stroke-width="2"/>
  <g font-size="12" fill="#64748b">
    <text x="720" y="480" text-anchor="middle">0.3</text>
    <text x="857" y="480" text-anchor="middle">0.5</text>
    <text x="994" y="480" text-anchor="middle">0.7</text>
    <text x="1131" y="480" text-anchor="middle">0.9</text>
    <text x="1200" y="480" text-anchor="middle">1.0</text>
    <text x="706" y="186" text-anchor="end">1.0</text>
    <text x="706" y="324" text-anchor="end">0.5</text>
    <text x="706" y="464" text-anchor="end">0.0</text>
  </g>
  <text x="960" y="506" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a5f">candidate length as a fraction of reference length →</text>

  <!-- gridline at BP=0.5 -->
  <line x1="720" y1="320" x2="1200" y2="320" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- curve polyline through computed points -->
  <polyline points="720,432.9 788.6,397.5 857.1,357.0 925.7,316.2 971.7,290.2 1028.6,259.4 1062.9,241.9 1131.4,209.4 1200,180"
            fill="none" stroke="#7c3aed" stroke-width="3.5"/>

  <!-- verified points -->
  <g>
    <circle cx="857.1" cy="357.0" r="7" fill="#b91c1c"/>
    <text x="843" y="352" text-anchor="end" font-size="12.5" font-weight="bold" fill="#b91c1c">half length: BP 0.3679</text>
    <circle cx="925.7" cy="316.2" r="6" fill="#7c3aed"/>
    <text x="939" y="312" font-size="12" fill="#475569">0.60x: 0.5134</text>
    <circle cx="971.7" cy="290.2" r="6" fill="#7c3aed"/>
    <text x="985" y="288" font-size="12" fill="#475569">0.667x: 0.6065</text>
    <circle cx="1028.6" cy="259.4" r="6" fill="#7c3aed"/>
    <text x="1042" y="256" font-size="12" fill="#475569">0.75x: 0.7165</text>
  </g>

  <rect x="690" y="536" width="520" height="100" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="710" y="564" font-size="14" font-weight="bold" fill="#b45309">Harsher than intuition</text>
  <text x="710" y="588" font-size="13" fill="#334155">A candidate at HALF the reference length does not get half the</text>
  <text x="710" y="608" font-size="13" fill="#334155">score. It keeps less than 37% of it: the curve is exponential, not</text>
  <text x="710" y="628" font-size="13" fill="#334155">linear. Truncated output is BLEU's loudest, earliest alarm.</text>
</svg>
