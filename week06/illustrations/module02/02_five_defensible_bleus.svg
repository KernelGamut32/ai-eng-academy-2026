<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#ffffff"/>

  <text x="640" y="42" text-anchor="middle" font-size="29" font-weight="bold" fill="#1e3a5f">One Sentence Pair. Five Defensible BLEU Scores.</text>
  <text x="640" y="70" text-anchor="middle" font-size="16" fill="#475569">Identical texts in every run. The only thing that changes is configuration, and configuration moves the score from 0 to 38.</text>

  <!-- The pair -->
  <rect x="240" y="88" width="800" height="66" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="640" y="114" text-anchor="middle" font-size="13.5" font-family="monospace" fill="#334155">reference: "the cat sat on the mat"   candidate: "the cat is on the mat"</text>
  <text x="640" y="140" text-anchor="middle" font-size="12.5" fill="#64748b">one word differs · precisions 83.3 / 60.0 / 25.0 / 16.7 · zero matching 4-grams is what smoothing has to handle</text>

  <!-- Bars: axis 0..40 -> height. baseline y=470, 40 -> 260px, so 6.5 px per point. x columns -->
  <g font-size="13">
    <!-- sacrebleu none 0.00 -->
    <rect x="140" y="468" width="90" height="2" fill="#b91c1c"/>
    <text x="185" y="452" text-anchor="middle" font-weight="bold" fill="#b91c1c" font-size="15">0.00</text>
    <text x="185" y="496" text-anchor="middle" font-weight="bold" fill="#1e3a5f">sacrebleu</text>
    <text x="185" y="514" text-anchor="middle" fill="#475569">smooth: none</text>
    <text x="185" y="534" text-anchor="middle" fill="#64748b" font-size="11.5">zero 4-grams kills the</text>
    <text x="185" y="548" text-anchor="middle" fill="#64748b" font-size="11.5">geometric mean</text>

    <!-- sacrebleu floor 8.03 -->
    <rect x="350" y="417.8" width="90" height="52.2" fill="#d97706"/>
    <text x="395" y="409" text-anchor="middle" font-weight="bold" fill="#b45309" font-size="15">8.03</text>
    <text x="395" y="496" text-anchor="middle" font-weight="bold" fill="#1e3a5f">sacrebleu</text>
    <text x="395" y="514" text-anchor="middle" fill="#475569">smooth: floor 0.001</text>

    <!-- sacrebleu exp default 37.99 -->
    <rect x="560" y="223.1" width="90" height="246.9" fill="#15803d"/>
    <text x="605" y="214" text-anchor="middle" font-weight="bold" fill="#15803d" font-size="15">37.99</text>
    <text x="605" y="496" text-anchor="middle" font-weight="bold" fill="#1e3a5f">sacrebleu</text>
    <text x="605" y="514" text-anchor="middle" fill="#475569">smooth: exp (DEFAULT)</text>

    <!-- NLTK unsmoothed 7.26e-78 -->
    <rect x="770" y="468" width="90" height="2" fill="#b91c1c"/>
    <text x="815" y="452" text-anchor="middle" font-weight="bold" fill="#b91c1c" font-size="15">7.26e-78</text>
    <text x="815" y="496" text-anchor="middle" font-weight="bold" fill="#1e3a5f">NLTK</text>
    <text x="815" y="514" text-anchor="middle" fill="#475569">default, no smoothing</text>
    <text x="815" y="534" text-anchor="middle" fill="#64748b" font-size="11.5">and refs come FIRST in</text>
    <text x="815" y="548" text-anchor="middle" fill="#64748b" font-size="11.5">the argument order</text>

    <!-- NLTK method1 0.2541 -> 25.41 -->
    <rect x="980" y="302.8" width="90" height="167.2" fill="#2563eb"/>
    <text x="1025" y="294" text-anchor="middle" font-weight="bold" fill="#2563eb" font-size="15">0.2541</text>
    <text x="1025" y="496" text-anchor="middle" font-weight="bold" fill="#1e3a5f">NLTK</text>
    <text x="1025" y="514" text-anchor="middle" fill="#475569">SmoothingFunction 1</text>
    <text x="1025" y="534" text-anchor="middle" fill="#64748b" font-size="11.5">0-to-1 scale: reads as</text>
    <text x="1025" y="548" text-anchor="middle" fill="#64748b" font-size="11.5">25.41 on sacrebleu's axis</text>
  </g>
  <line x1="110" y1="470" x2="1170" y2="470" stroke="#1e3a5f" stroke-width="2.5"/>
  <text x="118" y="230" font-size="12" fill="#64748b">40</text>
  <text x="118" y="466" font-size="12" fill="#64748b">0</text>

  <!-- Scale trap flag -->
  <rect x="900" y="180" width="300" height="76" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="920" y="206" font-size="13.5" font-weight="bold" fill="#b91c1c">Two scales in the wild</text>
  <text x="920" y="228" font-size="12.5" fill="#334155">sacrebleu reports 0 to 100. NLTK reports</text>
  <text x="920" y="246" font-size="12.5" fill="#334155">0 to 1. A "0.38 BLEU" is a scale question first.</text>

  <!-- Signature rescue -->
  <rect x="90" y="576" width="1100" height="118" rx="12" fill="#ecfdf5" stroke="#15803d" stroke-width="2"/>
  <text x="110" y="606" font-size="15" font-weight="bold" fill="#15803d">The rescue is not picking the "right" score. It is shipping the signature with whichever you picked.</text>
  <rect x="110" y="620" width="1060" height="34" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="640" y="643" text-anchor="middle" font-size="13.5" font-family="monospace" fill="#334155">nrefs:1|case:mixed|eff:no|tok:13a|smooth:exp|version:2.6.0</text>
  <text x="110" y="680" font-size="13" fill="#334155">sacrebleu prints this for a reason: a BLEU score without its signature is not a number, it is a guess with decimals. Pin it in the experiment log.</text>
</svg>
