<svg viewBox="0 0 1280 760" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="am6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#15803d"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1280" height="760" fill="#ffffff"/>

  <text x="640" y="42" text-anchor="middle" font-size="29" font-weight="bold" fill="#1e3a5f">The Lifecycle Is Two Pointers Moving Over Immutable Versions</text>
  <text x="640" y="70" text-anchor="middle" font-size="16" fill="#475569">The deck's four moments, drawn as pointer mechanics. No stage appears anywhere; the audit trail is alias history plus version tags.</text>

  <!-- Timeline spine -->
  <line x1="90" y1="330" x2="1190" y2="330" stroke="#94a3b8" stroke-width="3"/>
  <g font-size="14" text-anchor="middle" font-weight="bold">
    <circle cx="200" cy="330" r="17" fill="#1e3a5f"/><text x="200" y="336" fill="#ffffff">1</text>
    <circle cx="520" cy="330" r="17" fill="#1e3a5f"/><text x="520" y="336" fill="#ffffff">2</text>
    <circle cx="840" cy="330" r="17" fill="#1e3a5f"/><text x="840" y="336" fill="#ffffff">3</text>
    <circle cx="1120" cy="330" r="17" fill="#1e3a5f"/><text x="1120" y="336" fill="#ffffff">4</text>
  </g>

  <!-- Moment 1 (above) -->
  <rect x="90" y="110" width="240" height="180" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="210" y="138" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e3a5f">v1 registered</text>
  <text x="110" y="164" font-size="12.5" fill="#334155">From the sweep run. Recall</text>
  <text x="110" y="184" font-size="12.5" fill="#334155">below floor on the holdout.</text>
  <text x="110" y="210" font-size="12.5" font-family="monospace" fill="#b91c1c">validation_status=failed</text>
  <text x="110" y="238" font-size="12.5" fill="#334155">No alias assigned. It stays in</text>
  <text x="110" y="258" font-size="12.5" fill="#334155">the registry forever anyway:</text>
  <text x="110" y="278" font-size="12.5" fill="#334155">history, not garbage.</text>

  <!-- Moment 2 (below) -->
  <rect x="410" y="380" width="240" height="190" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="530" y="408" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e3a5f">v2 improves</text>
  <text x="430" y="434" font-size="12.5" fill="#334155">New features. Passes the recall</text>
  <text x="430" y="454" font-size="12.5" fill="#334155">floor. Gets the pointer:</text>
  <text x="430" y="480" font-size="12.5" font-family="monospace" fill="#7c3aed">@challenger -> v2</text>
  <text x="430" y="506" font-size="12.5" fill="#334155">Shadow test against live traffic</text>
  <text x="430" y="526" font-size="12.5" fill="#334155">begins. Champion still empty:</text>
  <text x="430" y="546" font-size="12.5" fill="#334155">nothing is serving yet.</text>

  <!-- Moment 3 (above) -->
  <rect x="720" y="110" width="240" height="180" rx="12" fill="#ecfdf5" stroke="#15803d" stroke-width="2"/>
  <text x="840" y="138" text-anchor="middle" font-size="14" font-weight="bold" fill="#15803d">v2 promoted</text>
  <text x="740" y="164" font-size="12.5" fill="#334155">Shadow test passes. The move:</text>
  <text x="740" y="190" font-size="12.5" font-family="monospace" fill="#15803d">@champion -> v2</text>
  <text x="740" y="216" font-size="12.5" fill="#334155">Old mapping recorded in alias</text>
  <text x="740" y="236" font-size="12.5" fill="#334155">history. v1 keeps its failed tag:</text>
  <text x="740" y="256" font-size="12.5" fill="#334155">the record of what was tried is</text>
  <text x="740" y="276" font-size="12.5" fill="#334155">part of the product.</text>

  <!-- Moment 4 (below) -->
  <rect x="1000" y="380" width="240" height="190" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="1120" y="408" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e3a5f">v3 enters</text>
  <text x="1020" y="434" font-size="12.5" fill="#334155">Larger model registered. The</text>
  <text x="1020" y="454" font-size="12.5" fill="#334155">challenger pointer MOVES:</text>
  <text x="1020" y="480" font-size="12.5" font-family="monospace" fill="#7c3aed">@challenger -> v3</text>
  <text x="1020" y="506" font-size="12.5" fill="#334155">v2 keeps serving as @champion</text>
  <text x="1020" y="526" font-size="12.5" fill="#334155">while v3 validates. Two pointers,</text>
  <text x="1020" y="546" font-size="12.5" fill="#334155">two jobs, zero downtime.</text>

  <!-- connectors -->
  <line x1="210" y1="290" x2="203" y2="313" stroke="#64748b" stroke-width="1.5"/>
  <line x1="530" y1="380" x2="521" y2="347" stroke="#64748b" stroke-width="1.5"/>
  <line x1="840" y1="290" x2="840" y2="313" stroke="#64748b" stroke-width="1.5"/>
  <line x1="1120" y1="380" x2="1120" y2="347" stroke="#64748b" stroke-width="1.5"/>
  <!-- challenger pointer hop 2->4 -->
  <path d="M 650 470 Q 830 440 1000 470" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#am6)"/>
  <text x="828" y="440" text-anchor="middle" font-size="12" fill="#7c3aed" font-weight="bold">the SAME pointer, overwritten: v2 is silently no longer @challenger</text>

  <!-- Gotcha panels -->
  <rect x="60" y="600" width="580" height="140" rx="14" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="80" y="630" font-size="14.5" font-weight="bold" fill="#b91c1c">Gotcha 1 · the missing break (verified)</text>
  <text x="80" y="656" font-size="12.5" fill="#334155">In the automated promotion loop, promote ONE candidate and stop.</text>
  <text x="80" y="676" font-size="12.5" fill="#334155">Without the break, every eligible run is promoted in turn, and because</text>
  <text x="80" y="696" font-size="12.5" fill="#334155">assignment is an overwrite, @challenger ends on the LAST one</text>
  <text x="80" y="716" font-size="12.5" fill="#334155">iterated: here, a lower-F1 model. The bug ships a worse model politely.</text>

  <rect x="660" y="600" width="580" height="140" rx="14" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="680" y="630" font-size="14.5" font-weight="bold" fill="#b91c1c">Gotcha 2 · where aliases are readable (verified on 3.15.1)</text>
  <text x="680" y="656" font-size="12.5" fill="#334155">search_model_versions returns version objects whose aliases field is</text>
  <text x="680" y="676" font-size="12.5" fill="#334155">EMPTY even when aliases are set. Read the map from</text>
  <text x="680" y="696" font-size="12.5" font-family="monospace" fill="#334155">get_registered_model(name).aliases</text>
  <text x="680" y="716" font-size="12.5" fill="#334155">or per version via get_model_version. And never .current_stage.</text>
</svg>
