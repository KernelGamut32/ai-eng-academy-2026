<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="am4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#15803d"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1280" height="720" fill="#ffffff"/>

  <text x="640" y="42" text-anchor="middle" font-size="29" font-weight="bold" fill="#1e3a5f">Three Runs, 0.002 Apart: Why the Rule Picks, Not the Eyeball</text>
  <text x="640" y="70" text-anchor="middle" font-size="16" fill="#475569">The verified C sweep. At honest scale the runs are identical; the champion rule was written before the results and a query enforces it.</text>

  <!-- Honest scale panel -->
  <rect x="40" y="95" width="590" height="290" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="335" y="126" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e3a5f">F1 at honest scale (0 to 1)</text>
  <!-- axis: y baseline 330, 1.0 -> 180px tall -->
  <g>
    <rect x="110" y="252.5" width="110" height="77.5" fill="#7c3aed"/>
    <rect x="260" y="252.9" width="110" height="77.1" fill="#94a3b8"/>
    <rect x="410" y="252.9" width="110" height="77.1" fill="#94a3b8"/>
    <line x1="80" y1="330" x2="580" y2="330" stroke="#1e3a5f" stroke-width="2"/>
  </g>
  <g font-size="13" text-anchor="middle">
    <text x="165" y="244" font-weight="bold" fill="#7c3aed">0.4303</text>
    <text x="315" y="244" fill="#475569">0.4286</text>
    <text x="465" y="244" fill="#475569">0.4286</text>
    <text x="165" y="352" fill="#334155">logreg_C0.1</text>
    <text x="315" y="352" fill="#334155">logreg_C1.0</text>
    <text x="465" y="352" fill="#334155">logreg_C10</text>
  </g>
  <text x="335" y="378" text-anchor="middle" font-size="12.5" fill="#334155">Recall is IDENTICAL across all three: 0.8308. The regularization dial barely mattered on this data.</text>

  <!-- Zoom panel -->
  <rect x="650" y="95" width="590" height="290" rx="14" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="945" y="126" text-anchor="middle" font-size="15" font-weight="bold" fill="#b91c1c">The same bars, axis zoomed to 0.425 to 0.432</text>
  <!-- zoom: value range .425..0.432 -> 180px tall, baseline 330. C0.1: (0.4303-0.425)/0.007*180=136.3 -> y=193.7. C1.0: (0.4286-0.425)/0.007*180=92.6 -> y=237.4 -->
  <g>
    <rect x="720" y="193.7" width="110" height="136.3" fill="#7c3aed"/>
    <rect x="870" y="237.4" width="110" height="92.6" fill="#94a3b8"/>
    <rect x="1020" y="237.4" width="110" height="92.6" fill="#94a3b8"/>
    <line x1="690" y1="330" x2="1190" y2="330" stroke="#1e3a5f" stroke-width="2"/>
    <text x="686" y="334" text-anchor="end" font-size="11" fill="#64748b">0.425</text>
    <text x="686" y="156" text-anchor="end" font-size="11" fill="#64748b">0.432</text>
  </g>
  <g font-size="13" text-anchor="middle">
    <text x="775" y="185" font-weight="bold" fill="#7c3aed">0.4303</text>
    <text x="925" y="229" fill="#475569">0.4286</text>
    <text x="1075" y="229" fill="#475569">0.4286</text>
  </g>
  <text x="945" y="360" text-anchor="middle" font-size="12.5" fill="#7f1d1d" font-weight="bold">This chart is how a 0.0017 gap gets mistaken for a finding. Zoomed axes manufacture drama.</text>
  <text x="945" y="378" text-anchor="middle" font-size="12" fill="#334155">Eyeballing the third decimal is not a selection strategy in either panel.</text>

  <!-- The rule pipeline -->
  <text x="640" y="428" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e3a5f">The champion rule, written BEFORE the results, enforced by a query</text>

  <rect x="60" y="450" width="300" height="110" rx="12" fill="#f8fafc" stroke="#1e3a5f" stroke-width="2"/>
  <text x="210" y="480" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e3a5f">All runs in the experiment</text>
  <text x="210" y="504" text-anchor="middle" font-size="12.5" font-family="monospace" fill="#334155">search_runs(order_by=</text>
  <text x="210" y="522" text-anchor="middle" font-size="12.5" font-family="monospace" fill="#334155">["metrics.f1 DESC"])</text>
  <text x="210" y="546" text-anchor="middle" font-size="12" fill="#64748b">3 candidates</text>

  <line x1="360" y1="505" x2="418" y2="505" stroke="#15803d" stroke-width="2.5" marker-end="url(#am4)"/>

  <rect x="423" y="450" width="330" height="110" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="588" y="480" text-anchor="middle" font-size="14" font-weight="bold" fill="#b45309">GATE: recall >= RECALL_FLOOR (0.80)</text>
  <text x="588" y="504" text-anchor="middle" font-size="12.5" fill="#334155">The staffing floor from the Day 1 analysis.</text>
  <text x="588" y="524" text-anchor="middle" font-size="12.5" fill="#334155">All three pass at 0.8308: the gate did not</text>
  <text x="588" y="542" text-anchor="middle" font-size="12.5" fill="#334155">bite today, and it stays anyway.</text>

  <line x1="753" y1="505" x2="811" y2="505" stroke="#15803d" stroke-width="2.5" marker-end="url(#am4)"/>

  <rect x="816" y="450" width="404" height="110" rx="12" fill="#ecfdf5" stroke="#15803d" stroke-width="2"/>
  <text x="1018" y="480" text-anchor="middle" font-size="14" font-weight="bold" fill="#15803d">TIEBREAK: max F1 among eligible</text>
  <text x="1018" y="506" text-anchor="middle" font-size="13" font-family="monospace" fill="#334155">Champion: logreg_C0.1 (f1=0.4303)</text>
  <text x="1018" y="528" text-anchor="middle" font-size="12.5" fill="#334155">by 0.0017: a margin the rule can act on and an</text>
  <text x="1018" y="546" text-anchor="middle" font-size="12.5" fill="#334155">eyeball cannot defend.</text>

  <!-- Footer -->
  <rect x="60" y="585" width="1160" height="110" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="80" y="617" font-size="15" font-weight="bold" fill="#7c3aed">Two honest sentences belong in the report, and they are not in tension</text>
  <text x="80" y="645" font-size="13.5" fill="#334155">"The rule selects logreg_C0.1" is procedure: deterministic, written down first, rerunnable in CI tomorrow. "With 65 positives, a 0.0017 F1 margin is far</text>
  <text x="80" y="667" font-size="13.5" fill="#334155">inside sampling noise" is statistics: Module 01's interval discipline applies whole. Ship the champion the rule picked, and report the margin as a tie.</text>
  <text x="80" y="687" font-size="13.5" fill="#334155">What the rule buys is not certainty: it is consistency, auditability, and the end of third-decimal arguments in the promotion meeting.</text>
</svg>
